    var el = null;
    for (var i = 0; i < cards.length; i++) {
      if (String(cards[i].getAttribute('data-bol') || '').toUpperCase() === want) {
        el = cards[i]; break;
      }
    }
    if (!el) { console.log('[form] no card for ' + want); return false; }

    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    setTimeout(function () { pulseDriver(el); }, 320);
    return true;
  }

  // Delegated, not per-row: the panel is rebuilt on every refresh and per-row
  // handlers would have to be re-attached each time.
  document.addEventListener('click', function (ev) {
    var tr = ev.target && ev.target.closest ? ev.target.closest('tr.jump') : null;
    if (!tr) return;
    var bol = tr.getAttribute('data-bol');
    if (bol) goToLoad(bol);
  });

  function scrollToSpot() {
    var el = document.getElementById('spotload');
    if (!el) {
      console.log('[form] spotlight: no card for ' + SPOT +
                  ' (not this carrier, or already departed)');
      return;
    }

    // Only jump when there is something to do.
    //
    // The point of the jump is to put the carrier in front of a field that
    // needs filling in. If the driver is already assigned, or a submission is
    // sitting pending, hauling them down the page and flashing at them says
    // "act on this" about something already handled. Worse, it does it every
    // time they open the link from that email, so a carrier who sorted it
    // yesterday gets summoned again today.
    var load = null;
    for (var i = 0; i < LOADS.length; i++) {
      if (isSpot(LOADS[i].bol)) { load = LOADS[i]; break; }
    }
    if (load && (load.driver || load.pendingDriver)) {
      SPOTTED = true;
      console.log('[form] spotlight: ' + SPOT + ' already has a driver (' +
                  (load.pendingDriver || load.driver) + '), not jumping');
      return;
    }

    SPOTTED = true;

    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        setTimeout(function () {
          var before = window.scrollY;
          try {
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
          } catch (e) {
            el.scrollIntoView(true);
          }

          // Some browsers ignore smooth scrolling inside a page that is still
          // settling. If nothing moved, do it by hand.
          setTimeout(function () {
            if (Math.abs(window.scrollY - before) > 4) return;
            var box = el.getBoundingClientRect();
            var target = window.scrollY + box.top - (window.innerHeight / 2) +
                         (box.height / 2);
            window.scrollTo({ top: Math.max(0, target), behavior: 'smooth' });
          }, 400);

          pulseDriver(el);
          console.log('[form] spotlight: jumped to ' + SPOT);
        }, 60);
      });
    });
  }

  // The driver field is what they came to fill in, so that is what lights up.
  // A glow around the whole card only repeats what the email already said.
  function pulseDriver(card) {
    var field = card.querySelector('select.drv') ||
                card.querySelector('input[disabled]');
    if (!field) return;
    field.classList.remove('pulse');
    void field.offsetWidth;          // restart it if it is already running
    field.classList.add('pulse');
  }

  // Ticking it reveals the trailer and ETA fields for that load. Unticking
  // clears them, so a box turned off cannot leave a trailer behind that we
  // would then reserve nothing against.
  // Empties the card and reveals the fields. Nothing is sent until Submit, so
  // this is a local reset rather than an instruction to us.
  // Trailers queued for removal, by BOL. Local until Submit.
  var DROPTL = {};

  function removeTrailer(i) {
    var l = LOADS[i];
    if (!l) return;
    DROPTL[l.bol] = String(l.tl || '').trim();

    var wrap = document.querySelector('[data-live="' + i + '"]');
    if (wrap) wrap.style.display = '';
    ['.ltl', '.letat'].forEach(function (sel) {
      var el = document.querySelector(sel + '[data-i="' + i + '"]');
      if (el) el.value = '';
    });
    // Every field, including the date. Leaving today in it is what made the
    // card look half filled to the validator.
    var d = document.querySelector('.letad[data-i="' + i + '"]');
    if (d) d.value = '';

    var btn = document.querySelector('.clearbtn[data-i="' + i + '"]');
    if (btn) {
      btn.disabled = true;
      btn.textContent = 'Trailer removed on submit';
    }
  }

  function clearShipment(i) {
    var card = document.querySelector('[data-live="' + i + '"]');
    if (card) card.style.display = '';

    var drv = document.querySelector('.drv[data-i="' + i + '"]');
    if (drv) { drv.value = ''; onDrv(drv); }

    ['.ltl', '.letad', '.letat'].forEach(function (sel) {
      var el = document.querySelector(sel + '[data-i="' + i + '"]');
      if (el) el.value = '';
    });

  }

  // Pool carrier: Live load opens trailer + ETA; unticking hides and clears
  // them, so nothing half-typed is sent.
  function onLive(box) {
    var i = box.getAttribute('data-i');
    var wrap = document.querySelector('.tchoice[data-i="' + i + '"]');
    if (!wrap) return;
    wrap.setAttribute('data-mode', box.checked ? 'live' : '');
    if (!box.checked) {
      ['.ltl', '.letad', '.letat'].forEach(function (sel) {
        var el = wrap.querySelector(sel);
        if (el) el.value = '';
      });
    }
    TOUCHED = true;
  }
  // Live-load carrier: Already on site swaps the ETA for SCAC and empty drop.
  function onCardOnsite(box) {
    var i = box.getAttribute('data-i');
    var wrap = document.querySelector('.tchoice[data-i="' + i + '"]');
    if (!wrap) return;
    wrap.setAttribute('data-mode', box.checked ? 'onsite' : 'coming');
    var ll = wrap.querySelector('.tll');
    if (ll) ll.textContent = box.checked ? 'Trailer on site' : 'Trailer #';
    TOUCHED = true;
  }
  // Bobtail: the driver drops nothing, so the empty box is cleared and shut.
  function onBobtail(b) {
    var e = document.querySelector('.lemp[data-i="' + b.getAttribute('data-i') + '"]');
    if (!e) return;
    if (b.checked) e.value = '';
    e.disabled = b.checked;
  }

  // Pending renames, keyed old name -> new name. Applied to the list on the
  // spot so every card showing that driver updates together, which is what
  // makes it read as a correction rather than an edit to one load.
  var RENAMES = {};

  // Edit mode, per card.
  //
  // The driver fields are read-only until somebody chooses Edit driver record.
  // They were always editable before, which meant a carrier could change a CDL
  // number while intending to assign somebody, and nothing said that the
  // change reached every load that driver is on.
  var EDITING = {};

  function fieldsLocked(i, locked) {
    ['.em', '.ed', '.et'].forEach(function (sel) {
      var el = document.querySelector(sel + '[data-i="' + i + '"]');
      if (el) { el.readOnly = locked; el.classList.toggle('locked', locked); }
    });
    var nm = document.getElementById('ednm' + i);
    if (nm) nm.style.display = locked ? 'none' : 'block';
    var note = document.getElementById('ednote' + i);
    if (note) note.style.display = locked ? 'none' : 'block';
  }

  function startEdit(i, who) {
    EDITING[i] = who;
    var sel = document.querySelector('.drv[data-i="' + i + '"]');
    sel.innerHTML = driverOptions(who, true);
    sel.value = who;

    var df = document.getElementById('df' + i);
    if (df) df.className = 'dfields on';

    var nm = document.getElementById('ednm' + i);
    if (nm) {
      var input = nm.querySelector('.ednin');
      input.value = who;
    }
    fieldsLocked(i, false);
  }

  // The server sends CDL numbers masked, last four only ("****6506"). A field
  // still showing the mask is unchanged and goes back empty, which the server
  // reads as "keep what is on file". Anything typed over it is sent as typed.
  function unmask(v) {
    return /^\*{2,}\s*[A-Za-z0-9]{0,4}$/.test(String(v || '').trim()) ? '' : v;
  }

  // Everything the carrier changed about this driver, or null.
  function editFrom(i) {
    var who = EDITING[i];
    if (!who) return null;

    var nm = document.getElementById('ednm' + i);
    var name = nm ? String(nm.querySelector('.ednin').value || '').trim() : who;
    if (!name) name = who;

    var mob = v('em', i), dl = v('ed', i), tk = v('et', i);
    var init = INIT[i] || {};

    var changed = name !== who ||
                  mob !== init.mobile || dl !== init.dl || tk !== init.tk;
    if (!changed) return null;

    // A name already on the roster is a different person, not a spelling.
    var clash = name !== who && DRIVERS.some(function (d) {
      return d.name.toLowerCase() === name.toLowerCase();
    });
    if (clash) return { clash: name };

    return { was: who, name: name, mobile: mob, dl: unmask(dl), tk: tk };
  }

  function onDrv(sel) {
    var i = sel.getAttribute('data-i');

    if (sel.value === '__EDIT__') {
      startEdit(i, (INIT[i] || {}).driver || '');
      return;
    }

    // Leaving the driver, or picking somebody else, ends the edit.
    if (EDITING[i]) { EDITING[i] = null; fieldsLocked(i, true); }

    var isNew = (sel.value === '__NEW__');
    var nb = document.getElementById('nb' + i);
    var df = document.getElementById('df' + i);
    if (nb) nb.style.display = isNew ? 'block' : 'none';
    if (df) df.className = 'dfields' + ((sel.value && !isNew) ? ' on' : '');
    var d = byName(sel.value);
    if (d) {
      var m = document.querySelector('.em[data-i="' + i + '"]');
      var c = document.querySelector('.ed[data-i="' + i + '"]');
      var t = document.querySelector('.et[data-i="' + i + '"]');
      if (m) m.value = d.mobile || '';
      if (c) c.value = d.dl || '';
      if (t) t.value = d.tk || '';
      // Picking a driver repopulates these from CARRIER. That is the script
      // writing, not the carrier, so the baseline moves with it. Read the
      // values back OUT of the inputs rather than trusting what we just put
      // in: the browser sanitizes them, and the baseline has to match what
      // the box really holds.
      if (INIT[i]) {
        INIT[i].mobile = m ? m.value : '';
        INIT[i].dl     = c ? c.value : '';
        INIT[i].tk     = t ? t.value : '';
      }
    }
  }

  // Any edit at all. A background refresh must never overwrite work in
  // progress, so once this is true the quiet update stops applying itself and
  // offers instead.
  document.addEventListener('input', function () { TOUCHED = true; });
  document.addEventListener('change', function () { TOUCHED = true; });

  function v(cls, i) {
    var el = document.querySelector('.' + cls + '[data-i="' + i + '"]');
    return el ? el.value.trim() : '';
  }

  // A new driver's name, first and last together as one string, which is how
  // it is stored everywhere else. Carriers were entering first names only,
  // which leaves nothing to tell two Mikes apart at the gate. Both fields are
  // required; spacing is tidied so "John  " + " Smith" reads "John Smith".
  function newName(i) {
    var f = v('nnf', i).replace(/\s+/g, ' '), l = v('nnl', i).replace(/\s+/g, ' ');
    return (f && l) ? f + ' ' + l : '';
  }

  function submitForm() {
    var p = { newDrivers: [], driverEdits: [], assignments: [], incoming: [],
              removeDrivers: [], removeTrailers: [] };

    Object.keys(DROPTL).forEach(function (bol) {
      var rl = (LOADS || []).filter(function (x) { return x.bol === bol; })[0];
      p.removeTrailers.push({ bol: bol, nfc: rl ? rl.nfc : '', tl: DROPTL[bol] });
    });
    var problem = '', seenEdit = {};

    // A driver can run several loads. They cannot be in two places on the
    // same day.
    //
    // Nothing checked this before, so a carrier could put one driver on two
    // shipments both delivering Tuesday and it would apply cleanly, with the
    // clash surfacing as a missed appointment rather than as an error.
    //
    // Tracked by delivery date, and it includes drivers ALREADY on other
    // loads, not just ones being assigned in this submission: most clashes
    // come from adding a second load to a driver who was already working.
    var dayOf = {};
    LOADS.forEach(function (ld, k) {
      // RETURNS DO NOT COUNT.
      //
      // A return is already on a trailer heading in, so the same driver can
      // and often does carry one alongside an outbound on the same day. The
      // clash rule exists for two outbound appointments a driver cannot both
      // make, and a return is not that.
      if (isReturn(ld)) return;

      var sl = document.querySelector('.drv[data-i="' + k + '"]');
      var name = sl ? (sl.value === '__NEW__' ? newName(k) : sl.value)
                    : (ld.pendingDriver || ld.driver);
      if (!name || !ld.delv) return;
      var key = name + '|' + ld.delv;
      if (!dayOf[key]) dayOf[key] = [];
      dayOf[key].push(ld.nfc || ld.bol);
    });

    LOADS.forEach(function(l, i) {
      // First problem wins, so the message names the top card that needs
      // fixing rather than whichever bad card happened to come last.
      if (problem) return;
      // Departed loads are submittable now; they land as pending for review.
      var sel = document.querySelector('.drv[data-i="' + i + '"]');
      var val = sel ? sel.value : '';

      // Same day, same driver, two loads. Returns are exempt, above.
      var who = (val === '__NEW__') ? newName(i) : val;
      if (who && l.delv && !isReturn(l)) {
        var clash = dayOf[who + '|' + l.delv] || [];
        if (clash.length > 1) {
          problem = who + ' is on ' + clash.length + ' loads delivering ' +
                    l.delv + ' (' + clash.join(', ') + '). ' +
                    'Pick a different driver for one of them.';
          return;
        }
      }

      if (val === '__NEW__') {
        var n = newName(i);
        if (!n) {
          problem = 'Enter the new driver\'s first and last name on ' + l.nfc + '.';
          return;
        }

        // A driver is not usable to us without all three. The mobile is how we
        // and the shipper reach them, the CDL is what the guard gate checks,
        // and the truck number is how the yard finds them. A name alone
        // becomes a phone call to the carrier later, which is the thing this
        // form exists to prevent.
        var miss = [];
        if (!v('nm', i)) miss.push('mobile number');
        if (!v('nd', i)) miss.push('CDL number');
        if (!v('nt', i)) miss.push('truck number');
        if (miss.length) {
          problem = n + ' needs a ' + miss.join(', a ') + ' before we can use them.';
          return;
        }

        p.newDrivers.push({ name: n, nfc: l.nfc, bol: l.bol, mobile: v('nm', i), dl: v('nd', i), tk: v('nt', i) });
        p.assignments.push({ bol: l.bol, nfc: l.nfc, driver: n });
      } else if (EDITING[i]) {
        var ed = editFrom(i);
        if (ed && ed.clash) {
          problem = ed.clash + ' is already on your driver list. Pick them ' +
                    'from the dropdown instead of renaming this one.';
          return;
        }
        if (ed) p.driverEdits.push(ed);

      } else if (!val && (INIT[i] || {}).driver) {
        // Cleared. The driver was on the card when it rendered and is not now.
        //
        // This produced nothing at all before: the collector skipped a blank
        // driver, so pressing Clear and submitting returned "Nothing
        // submitted" and the carrier had every reason to think it had worked.
        // An emptied field is a statement, and it needs to travel as one.
        p.removeDrivers.push({ bol: l.bol, nfc: l.nfc, driver: INIT[i].driver });

      } else if (val) {
        var init = INIT[i] || { driver: '', mobile: '', dl: '', tk: '' };

        // Only a real change from what was on screen counts. Comparing against
        // CARRIER instead produced phantom rows whenever MASTER and CARRIER
        // held the same number in a different format.
        if (val !== init.driver) {
          p.assignments.push({ bol: l.bol, nfc: l.nfc, driver: val });
        }

        var m = v('em', i), dl = v('ed', i), tk = v('et', i);

        // Same rule for an existing driver. Most are complete already, but a
        // record predating this form can be missing a field, and assigning
        // them is the moment it matters rather than the moment it is noticed.
        var gaps = [];
        if (!m)  gaps.push('mobile number');
        if (!dl) gaps.push('CDL number');
        if (!tk) gaps.push('truck number');
        if (gaps.length) {
          problem = val + ' is missing a ' + gaps.join(', a ') +
                    '. Fill it in on ' + l.nfc + ' and submit again.';
          return;
        }

        var touched = (m !== inputNorm(init.mobile)) ||
                      (dl !== inputNorm(init.dl)) ||
                      (tk !== inputNorm(init.tk));
        if (touched && !seenEdit[val]) {
          p.driverEdits.push({ name: val, mobile: m, dl: unmask(dl), tk: tk });
          seenEdit[val] = true;
        }
      }

      {
        // A load queued for trailer removal has nothing to report.
        //
        // Removing blanks the trailer and the time and resets the date to
        // today, so the both-or-neither rule below saw a date with no time and
        // refused to submit the very card being emptied. The removal is its
        // own record; there is no trailer here to validate.
        if (DROPTL[l.bol] !== undefined) return;

        // Hidden fields report nothing.
        //
        // When the trailer is already in the yard the block is hidden, but the
        // inputs are still in the page holding the trailer number and the
        // date prefill. The collector read them anyway, saw a trailer with a
        // date and no time, and refused to submit over a control the carrier
        // cannot see. Nothing on screen explained it and nothing they could do
        // would clear it.
        var wrap = document.querySelector('.tchoice[data-i="' + i + '"]');
        if (!wrap || wrap.style.display === 'none') return;
        var mode = wrap.getAttribute('data-mode') || '';
        if (!mode) return;                       // nothing chosen, nothing sent

        var base = INIT[i] || { ltl: '', leta: '' };
        var t  = v('ltl', i);

        // Already on site: trailer and the empty are required, SCAC is not.
        if (mode === 'onsite') {
          if (!t) { problem = 'Enter the trailer already on site for ' + l.nfc + '.'; return; }
          var bob = document.querySelector('.lbob[data-i="' + i + '"]');
          var bobtail = !!(bob && bob.checked);
          var emp = v('lemp', i);
          if (!bobtail && !emp) {
            problem = 'Enter the empty being dropped for ' + l.nfc + ', or tick Bobtail.';
            return;
          }
          var lsw = document.querySelector('.lswap[data-i="' + i + '"]');
          p.incoming.push({ bol: l.bol, nfc: l.nfc, tl: t, eta: 'ON SITE', onsite: true,
                            swap: !!(lsw && lsw.checked),
                            cur: v('lcs', i).toUpperCase(),
                            empty: bobtail ? 'bobtail' : emp });
          return;
        }

        var isLive = mode === 'live';
        var ed = mmdd(v('letad', i)), et = hhmm(v('letat', i));

        // A named trailer needs its ETA: the date first, then the time.
        if (t && !ed) {
          problem = 'Enter the ETA date for trailer ' + t + ' on ' + l.nfc + '.';
          return;
        }
        if (t && !et) {
          problem = 'Trailer ETA on ' + l.nfc + ' needs both a date and a time.';
          return;
        }
        if (!t && !base.ltl) return;
        var te = t ? etaJoin(ed, et) : '';
        // If what was on the sheet could not be parsed into the pickers,
        // an empty pair means "we could not show it", not "clear it". Treating
        // that as a change would wipe a note somebody deliberately left.
        var etaUnparsed = base.leta && !etaSplit(base.leta).date &&
                          !etaSplit(base.leta).time;
        var etaChanged = te !== inputNorm(base.leta) && !(etaUnparsed && !te);

        if (t !== inputNorm(base.ltl) || etaChanged || (isLive && !l.live)) {
          p.incoming.push({ bol: l.bol, nfc: l.nfc, tl: t, eta: te, live: isLive });
        }
      }
    });

    // En route edits. Only rows that changed are sent, compared against the
    // values the row was drawn with, so looking at the panel and pressing
    // Submit for something else does not resubmit every trailer on it.
    if (POOL) document.querySelectorAll('#enroute .er').forEach(function(r) {
      if (problem) return;
      var otl  = r.getAttribute('data-otl') || '';
      var oeta = r.getAttribute('data-oeta') || '';
      var bol  = r.getAttribute('data-bol') || '';
      var tl   = r.querySelector('.tl').value.trim();
      var pd   = mmdd(r.querySelector('.imd').value);
      var pt   = hhmm(r.querySelector('.et2').value);
      var eta  = etaJoin(pd, pt);
      if (tl === otl && eta === oeta) return;

      if (!tl) {
        problem = 'Trailer ' + otl + ' needs a trailer number.';
        return;
      }
      if (!pd) {
        var rn = r.getAttribute('data-nfc') || '';
        problem = 'Enter the ETA date for trailer ' + tl + (rn ? ' on ' + rn : '') + '.';
        return;
      }
      if (!pt) {
        problem = 'Trailer ' + tl + ' needs both a date and a time for its ETA.';
        return;
      }
      // The load card already sent this load's trailer: the card wins, since
      // two rows for one BOL would leave the answer to timestamp order.
      if (bol && p.incoming.some(function (x) { return x.bol === bol; })) return;

      p.incoming.push(bol
        ? { bol: bol, nfc: r.getAttribute('data-nfc') || '', tl: tl, eta: eta, was: otl }
        : { tl: tl, eta: eta, was: otl });
    });

    if (POOL) document.querySelectorAll('#incoming .inc').forEach(function(r) {
      var tl = r.querySelector('.tl').value.trim();

      // NO TRAILER, NO ROW.
      //
      // The date now defaults to today, so an untouched row carries a date and
      // nothing else. Checking the ETA before checking whether a trailer was
      // entered made every blank row look half-filled, and the form refused to
      // submit over spare rows nobody had touched.
      //
      // A row is only a row once it names a trailer.
      if (!tl) return;

      // On site: no ETA, and no SCAC asked here. The pool entry reads
      // "12345 - SCAC SWAP" until the yard moves it to NFCJ.
      var os = r.querySelector('.ios');
      if (os && os.checked) {
        var sw = r.querySelector('.ioswap');
        p.incoming.push({ tl: tl, eta: 'ON SITE', onsite: true, swap: !!(sw && sw.checked) });
        return;
      }
      var pd = mmdd(r.querySelector('.imd').value);
      var pt = hhmm(r.querySelector('.et2').value);
      if (!pd) {
        problem = 'Enter the ETA date for trailer ' + tl + '.';
        return;
      }
      if (!pt) {
        problem = 'Incoming trailer ' + tl +
                  ' needs both a date and a time for its ETA.';
        return;
      }
      p.incoming.push({ tl: tl, eta: etaJoin(pd, pt) });
    });

    // LIVE-LOAD CARRIERS: DRIVER AND TRAILER, BOTH, ON EVERY LOAD THEY SEND.
    //
    // They supply the trailer, so a load sent with a driver and no trailer
    // (or the other way round) leaves a hole nobody comes back to fill. Any
    // card this submission touches must end up with both, counting what is
    // already on file. Loads already loaded or rolling, returns, and sites
    // with no trailer tracking (WTB) are exempt.
    if (!problem && !POOL) {
      var sent = {};
      p.assignments.concat(p.newDrivers, p.incoming).forEach(function (x) {
        if (x && x.bol) sent[x.bol] = true;
      });
      LOADS.forEach(function (l, i) {
        if (problem || !sent[l.bol]) return;
        if (l.loaded || l.gone || isReturn(l) || l.trk === false) return;
        var sel = document.querySelector('.drv[data-i="' + i + '"]');
        var drv = sel ? (sel.value === '__NEW__' ? newName(i) : sel.value)
                      : (l.pendingDriver || l.driver || '');
        if (!drv) { problem = 'Choose the driver for ' + l.nfc + '.'; return; }
        var wrap = document.querySelector('.tchoice[data-i="' + i + '"]');
        var shown = wrap && wrap.style.display !== 'none';
        var tl = shown ? v('ltl', i) : String(l.tl || '').trim();
        if (!tl) { problem = 'Enter the trailer for ' + l.nfc + '.'; return; }
      });
    }

    if (problem) {
      document.getElementById('status').innerHTML = '<span class="err">' + esc(problem) + '</span>';
      return;
    }
    if (!p.newDrivers.length && !p.driverEdits.length &&
        !p.assignments.length && !p.incoming.length &&
        !p.removeDrivers.length && !p.removeTrailers.length) {
      document.getElementById('status').innerHTML = '<span class="err">Nothing to send yet.</span>';
      return;
    }

    document.getElementById('send').disabled = true;
    sendWithRetry(p, 0);
  }

  // Submissions are serialized server-side. If another carrier holds the lock,
  // keep trying rather than handing the problem back to this one.
  function sendWithRetry(payload, attempt) {
    var st = document.getElementById('status');
    var max = 6;

    st.innerHTML = attempt === 0
      ? 'Sending...'
      : '<span style="color:#8a6d1f;">Busy with other traffic. Retrying, attempt ' +
        (attempt + 1) + ' of ' + max + '...</span>';

    // Content-Type text/plain is deliberate and load-bearing. Declaring JSON
    // would make this a non-simple request, the browser would send an OPTIONS
    // preflight first, and Apps Script cannot answer OPTIONS at all. The body
    // is still JSON; only the declared type differs.
    // Bounded.
    //
    // Without a timeout a slow Apps Script answer left the promise unsettled
    // forever: "Sending..." stayed on screen, the retry never fired because
    // nothing had failed, and the carrier had no way to tell whether their
    // work had landed. An execution that queues behind other traffic can take
    // a long time to start, which is exactly when this happens.
    //
    // 30 seconds, then treat it as a retryable failure like any other.
    var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var timer = setTimeout(function () {
      if (ctrl) ctrl.abort();
    }, 30000);

    // THE EDGE TAKES THE WRITE, APPS SCRIPT IS THE FALLBACK.
    //
    // Posting to Apps Script meant waiting on an execution slot shared with
    // every ops job in the book: 4 to 13 seconds normally, and on the morning
    // of the 17th a submission failed outright while a promote held a slot for
    // 63 seconds. The work is an append to one tab; the waiting was everything
    // else.
    //
    // The edge verifies the same token with the same secret, writes to KV, and
    // answers in about 100ms whatever Google is doing. Apps Script drains it on
    // its own schedule.
    //
    // Falling back on ANY edge failure, including a non-ok response, because a
    // submission that cannot reach the edge must still reach us. The old path
    // is slower, not worse.
    var useEdge = (attempt === 0 || attempt === 1);
    var target = useEdge
      ? EDGE + '/submit?t=' + encodeURIComponent(TOKEN)
      : API;
    var body = useEdge
      ? JSON.stringify({ data: payload })
      : JSON.stringify({ api: 'submit', t: TOKEN, data: payload });

    fetch(target, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: body,
      redirect: 'follow',
      signal: ctrl ? ctrl.signal : undefined
    })
      .then(function (r) { clearTimeout(timer); return r.json(); })
      .then(function (res) {
        if (res.ok) {
          st.textContent = '';
          document.getElementById('ovlmsg').textContent = res.message;

          // ITEMISED.
          //
          // A count is a receipt, not an account of what happened. A carrier
          // who assigned one driver and took another off cannot check either
          // from "2 changes", and checking is the only thing a confirmation is
          // for. One line per change, naming the driver, the trailer and the
          // shipment.
          var ul = document.getElementById('ovllist');
          ul.innerHTML = (res.details || []).map(function (d) {
            return '<li>' + esc(d) + '</li>';
          }).join('');
          ul.style.display = (res.details || []).length > 1 ? 'block' : 'none';

          // APPLIED LOCALLY, IMMEDIATELY.
          //
          // Not waiting to be told. KV is readable by key the moment it is
          // written, but the LIST call that finds it lags by seconds, so a
          // refresh straight after a submission asks the edge what is queued
          // and is correctly told nothing yet. That is why pending took two or
          // three refreshes to appear.
          //
          // The form has the payload in its hand. It does not need a round
          // trip to learn what it just sent.
          // Loudly. A silent catch here hid the fact that this was failing at
          // all: the card kept showing the old driver until the refresh caught
          // up seconds later, and nothing anywhere said why.
          try {
            var mine = { data: payload, at: Date.now() };
            LOCALQ = LOCALQ.concat([mine]);
            applyQueued(LOADS, [mine]);
            renderAll();
            console.log('[form] applied locally',
                        JSON.stringify(payload).slice(0, 300));
          } catch (e) {
            console.error('[form] LOCAL APPLY FAILED', e && (e.stack || e.message));
          }

          // And the real refresh behind the confirmation, which reconciles
          // this against what we actually hold once KV catches up.
          startRefresh();
          document.getElementById('ovl').className = 'on';
          TOUCHED = false;      // their work is in; polling can resume
          return;
        }
        // An edge refusal is not a dead end. Retrying moves to Apps Script,
        // which is the path that worked yesterday.
        handleSendFailure(useEdge ? 'BUSY edge: ' + (res.error || 'refused')
                                  : (res.error || ''),
                          payload, attempt, max, st);
      })
      .catch(function (e) {
        clearTimeout(timer);
        var aborted = (e && (e.name === 'AbortError' ||
                             /abort/i.test(e.message || '')));
        handleSendFailure(aborted ? 'BUSY timeout' : (e.message || ''),
                          payload, attempt, max, st);
      });
  }

  // The page lives in Apps Script's sandboxed iframe, so location.reload()
  // reloads the frame rather than the top window and leaves it blank. Nothing
  // needs reloading anyway: re-fetch the payload and re-render in place.
  function applyPayload(p) {
    p = p || {};

    // Remember any provisional loads, and put back ones a later payload
    // dropped. An Apps Script read has no idea these exist.
    var incoming = (p.loads || []).filter(function (l) { return l.provisional; });
    if (incoming.length) PROV = incoming;

    // PROVISIONAL LOADS EXPIRE.
    //
    // They are held because a shipment exists on a site sheet before it
    // reaches MASTER, and an Apps Script read cannot see it. That is right
    // while it is pending and wrong forever afterwards: once the load
    // DELIVERS, MASTER stops returning it, the payload correctly omits it, and
    // this put it straight back. A carrier was still being shown a shipment
    // that ran yesterday, with no pickup line and sorted to the bottom,
    // because it was built from the site sheet rather than from MASTER.
    //
    // Same rule the payload itself uses: delivered is delivered.
    if (PROV.length) {
      PROV = PROV.filter(function (l) { return !delvPassed(l); });
    }

    if (PROV.length) {
      var have = {};
      (p.loads || []).forEach(function (l) {
        if (l && l.bol) have[String(l.bol).trim().toUpperCase()] = true;
      });
      var missing = PROV.filter(function (l) {
        return !have[String(l.bol).trim().toUpperCase()];
      });
      if (missing.length) p.loads = (p.loads || []).concat(missing);
    }

    LOADS   = p.loads   || [];
    DRIVERS = p.drivers || [];
    ONSITE  = p.onsite  || [];
    POOL    = !!p.pool;
    PENDTL  = p.pendingTrailers || [];
    HELD    = p.held || [];
    if (p.etaGraceMin) ETA_GRACE_MIN = p.etaGraceMin;
    QUEUED  = p.queued || [];

    // SUBMISSIONS STILL AT THE EDGE.
    //
    // Between pressing Submit and Apps Script draining, a submission exists in
    // KV and nowhere else. The board comes from MASTER, so it knows nothing
    // about it, and without this the carrier reloads and watches the driver
    // they just entered disappear. That is the single worst thing this form
    // could do.
    //
    // Folded into the same pending fields an applied-but-not-promoted row
    // uses, so the card shows "Received: <name>" exactly as it does today and
    // nothing downstream has to learn a third state.
    // EVERY payload gets the local queue folded in, not just the edge's view.
    //
    // applyPayload REPLACES the loads, so anything applied locally is gone the
    // moment a refresh lands. The post-submit refresh runs seconds after the
    // submission, KV's list has not caught up, the payload reports nothing
    // queued, and the pending state the carrier just watched appear is wiped.
    // That is why it took two or three refreshes: they were waiting for KV to
    // catch up while the form kept undoing itself in between.
    p.queued = mergeQueued(p.queued || [], p.loads || []);
    QUEUED = p.queued;

    applyQueued(p.loads || [], p.queued);
    renderAll();
  }

  // What the edge reports, plus anything we sent that it has not caught up on.
  //
  // A local entry is dropped once the board itself shows the change, which is
  // the only honest signal that it is no longer merely queued: the drain has
  // run and CF.INBOX is reporting it, or promote has applied it outright.
  // Without that test a local entry would linger and keep re-asserting a
  // pending state after the real one arrived.
  function mergeQueued(fromEdge, loads) {
    var out = (fromEdge || []).slice();

    var find = function (bol) {
      return (loads || []).filter(function (l) { return l.bol === bol; })[0];
    };

    // Already represented by the edge, so ours would be a duplicate.
    var seen = {};
    out.forEach(function (q) {
      ((q.data || {}).assignments || []).forEach(function (a) { seen[a.bol] = true; });
      ((q.data || {}).removeDrivers || []).forEach(function (c) { seen[c.bol] = true; });
    });

    (LOCALQ || []).forEach(function (q) {
      var d = q.data || {};
      var live = false;

      (d.assignments || []).forEach(function (a) {
        var l = find(a.bol);
        if (seen[a.bol]) return;
        // Not yet showing on the board in any form, so still ours to assert.
        if (l && l.driver !== a.driver && l.pendingDriver !== a.driver) live = true;
      });
      (d.removeDrivers || []).forEach(function (c) {
        var l = find(c.bol);
        if (seen[c.bol]) return;
        if (l && (l.driver || l.pendingDriver) && !l.pendingClear) live = true;
      });
      (d.removeTrailers || []).forEach(function (c) {
        var l = find(c.bol);
        if (l && l.tl && !l.pendingTrailerClear) live = true;
      });
      (d.incoming || []).forEach(function () { live = true; });
      (d.driverEdits || []).forEach(function () { live = true; });

      if (live) out.push(q);
    });

    return out;
  }

  // What is waiting on us for this load, oldest first.
  //
  // Read from the same queued submissions the overlay uses, so the list and
  // the card state cannot disagree. Only covers work still in the queue: once
  // it is drained onto CF.INBOX the pending flags from the payload take over,
  // which is the older single-line display below.
  // Oldest first, on the submission time. Anything without one sorts first,
  // since it can only be older than something we stamped.
  function ordered(list) {
    return (list || []).slice().sort(function (a, b) {
      return ((a && a.at) || 0) - ((b && b.at) || 0);
    });
  }

  // One submission, once, whichever list it arrived in.
  //
  // The same submission comes back two ways: LOCALQ holds the object we sent,
  // and the edge returns its own copy parsed out of KV. Identical content,
  // different objects, so an identity check never matched them and every
  // action was listed twice. With two actions in one submission the repeats
  // are not even adjacent, which is why collapsing consecutive lines missed
  // it: assigned, trailer, assigned, trailer.
  //
  // Compared on the payload itself. Two deliberate submissions of exactly the
  // same thing collapse too, which is correct: promote applies one of them and
  // supersedes the other, so one line is what actually happens.
  function uniqueSubs(list) {
    var seen = {}, out = [];
    ordered(list).forEach(function (q) {
      var k;
      try { k = JSON.stringify((q && q.data) || {}); }
      catch (e) { k = String(Math.random()); }   // unserialisable: keep it
      if (seen[k]) return;
      seen[k] = true;
      out.push(q);
    });
    return out;
  }

  function pendingActs(l) {
    // BOTH LISTS, DEDUPED BY IDENTITY.
    //
    // Reading QUEUED alone was wrong in the other direction: right after a
    // submission the entry exists only in LOCALQ, so the card showed the load
    // as though nothing had been submitted until a refresh merged the two.
    //
    // Concatenating blindly was the original fault, since mergeQueued puts the
    // SAME objects from LOCALQ into QUEUED and each was then counted twice.
    // That is also what makes identity the right test: the duplicate is
    // literally the same object, not a copy that happens to match.
    var out = [];
    uniqueSubs((QUEUED || []).concat(LOCALQ || [])).forEach(function (q) {
      var d = (q && q.data) || {};
      (d.assignments || []).forEach(function (a) {
        if (a.bol === l.bol) out.push((a.driver || 'Driver') + ' assigned');
      });
      (d.newDrivers || []).forEach(function (n) {
        if (n.bol === l.bol && n.name) out.push(n.name + ' added and assigned');
      });
      (d.removeDrivers || []).forEach(function (c) {
        if (c.bol === l.bol) {
          out.push((c.driver ? c.driver + ' removed' : 'Driver removed'));
        }
      });
      (d.removeTrailers || []).forEach(function (c) {
        if (c.bol === l.bol) {
          out.push('Trailer ' + (c.tl || '') + ' removed');
        }
      });
      (d.incoming || []).forEach(function (t) {
        if (t.bol === l.bol && t.tl) {
          out.push('Trailer ' + t.tl + etaWords(t.eta));
        }
      });
    });

    // Identical lines collapse.
    //
    // Two submissions saying the same thing are genuinely in flight when one
    // is still queued at the edge and the carrier repeats it, and the outcome
    // is the same either way. "TEST assigned" twice tells them nothing the one
    // line does not, and reads as a bug.
    //
    // Only CONSECUTIVE repeats, so assigned, removed, assigned still shows all
    // three: that sequence is the story.
    var tidy = [];
    out.forEach(function (line) {
      if (tidy.length && tidy[tidy.length - 1] === line) return;
      tidy.push(line);
    });
    return tidy;
  }

  // Folds queued submissions onto the loads.
  //
  // Used for what the edge reports AND for what we just sent, because those
  // are the same shape and the second one has to work without waiting for the
  // first. KV is readable by key immediately but its LIST call lags by
  // seconds, so a refresh straight after a submission asks the edge what is
  // queued and is honestly told nothing. That is why pending took two or three
  // refreshes to appear.
  //
  // The form knows what it sent. It does not need to be told.
  function applyQueued(loads, queued) {
    // CHRONOLOGICAL, ALWAYS.
    //
    // These arrive from two places: the edge, where KV lists keys in
    // lexicographic order, and our own local list appended as we send. Both
    // happen to be in order today, which is exactly the kind of thing that
    // stops being true quietly. Assign then remove and remove then assign are
    // different answers, so the order is enforced rather than assumed.
    //
    // Same rule promote applies: the newest submission for a load wins.
    uniqueSubs(queued).forEach(function (q) {
      var d = (q && q.data) || {};
      var find = function (bol) {
        return (loads || []).filter(function (l) { return l.bol === bol; })[0];
      };

      (d.assignments || []).forEach(function (a) {
        var hit = find(a.bol);
        if (hit) hit.pendingDriver = a.driver;
      });
      (d.newDrivers || []).forEach(function (n) {
        var hit = find(n.bol);
        if (hit && n.name) hit.pendingDriver = n.name;
      });
      (d.removeDrivers || []).forEach(function (c) {
        var hit = find(c.bol);
        if (hit) { hit.pendingClear = true; hit.pendingDriver = ''; }
      });
      (d.removeTrailers || []).forEach(function (c) {
        var hit = find(c.bol);
        if (hit) hit.pendingTrailerClear = true;
      });
      // Incoming trailers land in the pending list the panel already renders.
      (d.incoming || []).forEach(function (t) {
        if (t && t.tl) PENDTL.push({ tl: t.tl, eta: t.eta || "",
                                     was: t.was || "", bol: t.bol || "" });
      });
    });
  }

  // Draws everything from the current state.
  // THE LOADS NOTE.
  //
  // Under the Loads heading: how many loads still need something, updated as
  // the carrier fills them in, then one line of guidance for their kind of
  // carrier. Nothing moves, fades or follows them. Pool carriers are pointed
  // at Incoming Trailers (the link jumps there and pulses it once); Live load
  // is never suggested.
  function noteDriverName(l, i) {
    var sel = document.querySelector('.drv[data-i="' + i + '"]');
    if (!sel) return l.pendingDriver || l.driver || '';
    return sel.value === '__NEW__' ? newName(i) : sel.value;
  }
  function noteTrailerNo(l, i) {
    var wrap = document.querySelector('.tchoice[data-i="' + i + '"]');
    return (wrap && wrap.style.display !== 'none') ? v('ltl', i) : String(l.tl || '').trim();
  }
  function loadsNote() {
    var el = document.getElementById('loadsnote');
    if (!el) return;
    var d = 0, t = 0;
    LOADS.forEach(function (l, i) {
      if (l.loaded || l.gone || isReturn(l)) return;
      if (!noteDriverName(l, i)) d++;
      if (!POOL && l.trk !== false && !noteTrailerNo(l, i)) t++;
    });
    var n = function (k, what) { return k + (k === 1 ? ' load needs ' : ' loads need ') + what + '.'; };
    var yard = esc(sitePhrase() || 'the yard');
    var status = POOL
      ? (d ? n(d, 'a driver') : 'Every load has a driver.')
      : (d && t ? n(Math.max(d, t), 'a driver or trailer')
         : d ? n(d, 'a driver') : t ? n(t, 'a trailer')
         : 'Every load has a driver and trailer.');
    // Pool carriers have Incoming Trailers right beside this, so the count is
    // all they need here.
    var guide = POOL ? ''
      : 'Driver and trailer are required on every load. ' +
        'Trailer already at ' + yard + '? Tick Already on site on that load.';
    el.innerHTML = '<b>' + status + '</b>' + guide;
  }
  document.addEventListener('change', function (e) {
    if (e.target && e.target.closest && e.target.closest('#loads')) loadsNote();
  });
  document.addEventListener('input', function (e) {
    if (e.target && e.target.closest && e.target.closest('#loads')) loadsNote();
  });

  function renderAll() {
    // Live-load carriers report equipment on the shipment card, so a pool
    // list has nowhere to go for them.
    document.getElementById('inccard').style.display = POOL ? 'block' : 'none';



    // One blank row. Most visits add nothing, and + Add another is right there.
    document.getElementById('incoming').innerHTML = incRow();
    var old = document.getElementById('pendtl');
    if (old) old.parentNode.removeChild(old);

    // Before the panels, since both their captions name the yards.
    renderSiteNotes();
    renderOnsite();
    renderEnroute();
    renderPendingTrailers();
    renderLoads();
    loadsNote();

    var b = document.getElementById('send');
    b.disabled = false;
    b.textContent = 'Submit';
    document.getElementById('status').textContent = '';
  }

  // Reads the board. A plain GET with no custom headers, so the browser
  // treats it as a simple request and never sends a preflight.
  // The first load consumes the request the head already started. A refresh
  // after submitting makes a fresh one.
  function loadBoard(onDone, fresh) {
    // A REFRESH GOES TO THE EDGE, NOT TO APPS SCRIPT.
    //
    // This is the call that runs straight after a submission, and submissions
    // now land in the edge queue. Apps Script has not seen them yet and cannot
    // report them, so refreshing from there returned a board with the
    // carrier's work missing and wiped the pending state off the cards. The
    // edge is the only place that knows about both the board AND what is
    // still queued.
    //
    // Apps Script stays as the fallback, exactly as it is on first paint.
    var p = (!fresh && window.BOARD)
      ? window.BOARD
      : fetch(EDGE + '/payload?t=' + encodeURIComponent(TOKEN), { method: 'GET' })
          .then(function (r) { return r.json(); })
          .then(function (q) {
            if (q && q.ok) return q;
            if (q && q.error === 'expired') return q;
            return fetch(API + '?api=payload&fresh=1&t=' + encodeURIComponent(TOKEN),
                         { method: 'GET', redirect: 'follow' })
                     .then(function (r) { return r.json(); });
          });
    window.BOARD = null;
    p
      .then(function (p) {
        if (!p.ok) { showDead(p.error); return; }
        LAST_EDGE = !!p.edge;
        LAST_AGE  = p.age || 0;
        SCAC = p.scac || '';
        document.getElementById('cname').textContent = p.cname || p.scac || '';
        reveal();
        applyPayload(p);
        if (onDone) onDone();
      })
      .catch(function (e) {
        showDead('unreachable', e.message);
        if (onDone) onDone();
      });
  }

  // Continue: close immediately, refresh behind them.
  //
  // This used to hold the confirmation open while a fresh payload was fetched,
  // which is another two to three seconds of a carrier watching a spinner
  // AFTER their work was already safely recorded. It also put a second
  // request into the same execution pool their submission just queued for.
  //
  // The board on screen is already correct: pendingClear, pendingDriver and
  // the rest are rendered from what they just did. The refetch only confirms
  // it, so it can happen behind the closed overlay and repaint if anything
  // differs.
  function refreshBoard() {
    document.getElementById('ovl').className = '';
    window.scrollTo(0, 0);

    var btn = document.getElementById('ovlbtn');
    btn.disabled = false;
    btn.textContent = 'Continue';

    // Already done, behind the confirmation. See startRefresh below.
  }

  // REFRESH WHILE THEY ARE READING THE CONFIRMATION.
  //
  // It used to start when they pressed Continue, so the board underneath was
  // still showing the state from before their submission and only caught up a
  // second or two later, or not until they refreshed by hand. The moment they
  // close the box is the moment they look at the board, and it should be right
  // by then.
  //
  // The submission is already recorded, so this is a read that nobody is
  // waiting on. It runs while the confirmation is on screen, which is dead
  // time we were not using.
  //
  // TOUCHED is cleared first: the carrier's edits are what they just sent, so
  // treating them as unsaved work would make the refresh offer to reload
  // instead of simply applying.
  function startRefresh() {
    TOUCHED = false;
    try { loadBoard(null, true); } catch (e) {}
  }

  // Nothing is on screen until the board arrives, so the wait sits under our
  // own brand rather than a half-built form.
  // Creeps toward 90% and waits there. Nothing here knows how long Apps
  // Script will take, so pretending to would mean a bar that stalls at 99% or
  // finishes early and then sits there. Easing toward an asymptote is honest:
  // it says "still going" without claiming to know how much is left.
  var progress = 0;
  setBar(0);
  var creep = setInterval(function () {
    progress += (90 - progress) * 0.08;
    setBar(progress);
  }, 120);

  // The rig travels the width of the stage, offset by its own width so it
  // starts fully off the left edge and arrives with its nose at the end.
  // Sits at the start line at zero and finishes with its nose at the far end.
  // Measured rather than guessed: the lane and the rig are both fluid now, so
  // a hardcoded offset would overshoot on a wide screen and stop short on a
  // phone.
  function setBar(pct) {
    var r = document.querySelector('#bar .rig');
    var lane = document.querySelector('#bar .lane');
    if (!r || !lane) return;
    var travel = lane.clientWidth - r.querySelector('svg').clientWidth;
    r.style.transform = 'translateX(' + (travel * pct / 100) + 'px)';
  }

  function finishBar() {
    clearInterval(creep);
    setBar(100);
    var b = document.getElementById('bar');
    if (b) b.className = 'done';
    setTimeout(function () { if (b && b.parentNode) b.parentNode.removeChild(b); }, 900);
  }

  if (!TOKEN) showDead('missing');
  else loadBoard(function () {
    finishBar();
    console.log('[form] board ready in ' + (Date.now() - window.T0) + 'ms' +
                (LAST_EDGE ? ' (edge, ' + Math.round(LAST_AGE / 1000) + 's old)'
                           : ' (apps script)'));
    revalidate();
    startPolling();
  });

  // Keeps the board honest without anyone reloading.
  //
  // Runs once straight after the first render, then every thirty seconds while
  // the page is open. A carrier often leaves this sitting on a phone in the
  // cab for an hour: a driver assigned at the desk in that time should reach
  // them, not wait for them to think to refresh.
  //
  // If the carrier has started typing, it does NOT re-render. Losing
  // half-entered driver details to a background refresh would be far worse
  // than showing a load that was reassigned ninety seconds ago; they get a
  // notice instead and choose when.
  var POLL_MS = 30000;
  var polling = null;

  // JITTERED, so windows do not poll in lockstep.
  //
  // Three forms open on one carrier all polled on the same second, all saw the
  // edge copy expire at the same instant, and all three called Apps Script
  // before any of them had pushed the refresh. Three executions where one
  // would do, every trust window, and it gets worse the more windows are open.
  //
  // A few seconds of spread is enough: the first to fall back re-arms the
  // cache and the rest are served from the edge. setTimeout rather than
  // setInterval because the delay has to change each round.
  function pollDelay() {
    return POLL_MS + Math.floor(Math.random() * 8000) - 4000;   // 26s to 34s
  }

  function startPolling() {
    if (polling) return;
    var tick = function () {
      // Nothing to gain polling a tab nobody is looking at.
      if (!document.hidden) revalidate();
      polling = setTimeout(tick, pollDelay());
    };
    polling = setTimeout(tick, pollDelay());
  }

  // Catch up the moment they come back to the tab.
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) revalidate();
  });

  // How fresh the edge copy has to be to be trusted without asking.
  //
  // Every push updates it, and pushes happen on promote, on a submission, on a
  // checkin and whenever a link is minted. So a copy pushed a minute ago is
  // current unless somebody typed straight into MASTER, which the poll still
  // catches within the window.
  //
  // TEN MINUTES, not ninety seconds. Every change that matters pushes the
  // board: a promote, an assign, a check-in, a submission, a Run. So the edge
  // copy only goes stale when somebody types straight into MASTER, and the
  // ninety second window was paying a full Apps Script execution every poll
  // to catch that one case: a doGet every one to two minutes per open form,
  // all afternoon. Ten minutes bounds a hand edit's delay to something a
  // carrier will never notice, and removes almost every fallback.
  var EDGE_TRUST_MS = 600000;

  function revalidate() {
    // ASK THE EDGE FIRST, AND USUALLY STOP THERE.
    //
    // This used to go straight to Apps Script on every load and again every
    // thirty seconds. With several carriers holding the form open, that was a
    // steady stream of executions against the same book the ADC report and the
    // webhook are using, and every one of them made the others slower.
    //
    // The edge already reports how old its copy is. If it was pushed within
    // the trust window it IS the current answer, and asking Google to confirm
    // it costs a container start to be told nothing.
    if (LAST_EDGE && LAST_AGE < EDGE_TRUST_MS) {
      return checkEdge();
    }

    var before = JSON.stringify(LOADS) + JSON.stringify(ONSITE) +
                 JSON.stringify(DRIVERS);

    // Straight to Apps Script, deliberately. This call exists to get the
    // authoritative answer, and asking a cache whether the cache is right
    // would defeat the entire point of asking.
    fetch(API + '?api=payload&fresh=1&t=' + encodeURIComponent(TOKEN),
          { method: 'GET', redirect: 'follow' })
      .then(function (r) { return r.json(); })
      .then(function (p) {
        // TRY THE EDGE AGAIN NEXT TIME.
        //
        // Falling back to Apps Script left LAST_EDGE false and nothing ever
        // set it back, so one stale moment pinned the form to the expensive
        // path for the rest of the session: a doGet every thirty seconds,
        // forever, per open form. That is 120 executions an hour against the
        // same book everything else is using, which is the exact load the
        // trust window exists to prevent.
        //
        // checkEdge reads the age and decides honestly, dropping back here if
        // the copy really is stale. So the worst case is alternating, and the
        // normal case is one fallback followed by a return to the edge as soon
        // as anything pushes.
        // AND THE AGE, which is the half I left out.
        //
        // Setting LAST_EDGE without LAST_AGE achieved nothing: the next poll
        // tests both, saw the old age still past the window, and fell back
        // again. Every poll, forever, which is the thirty second rhythm that
        // survived the last two fixes.
        //
        // Zero is the truth here rather than an optimistic guess: doGet pushes
        // the payload it just built back to the edge before returning, so the
        // copy is current as of this moment.
        LAST_EDGE = true;
        LAST_AGE  = 0;

        if (!p.ok) return;
        // Apps Script cannot see the edge queue, so a payload from it carries
        // no queued items. Applying it as-is would drop a submission that has
        // not drained yet off the board. Carried across from what we already
        // have rather than asking the edge again.
        var after = JSON.stringify(p.loads || []) +
                    JSON.stringify(p.onsite || []) +
                    JSON.stringify(p.drivers || []);
        if (after === before) return;

        if (TOUCHED) { offerRefresh(); return; }

        // Hold the scroll position across the swap. Re-rendering resets it to
        // the top, which on a long board throws the carrier back to the
        // beginning for a change they may not even have noticed.
        var y = window.scrollY;
        applyPayload(p);
        window.scrollTo(0, y);
        console.log('[form] quietly updated from fresh data');
      })
      .catch(function () { /* the cached view is still perfectly usable */ });
  }

  // A cheap poll: re-read the edge and apply it if it moved.
  //
  // Costs nothing on the spreadsheet, so it can run as often as we like. Only
  // when the edge itself has gone stale does this fall through to Apps Script
  // and the authoritative read.
  function checkEdge() {
    var before = JSON.stringify(LOADS) + JSON.stringify(ONSITE) +
                 JSON.stringify(DRIVERS);

    fetch(EDGE + '/payload?t=' + encodeURIComponent(TOKEN), { method: 'GET' })
      .then(function (r) { return r.json(); })
      .then(function (p) {
        if (!p || !p.ok) return;
        LAST_AGE = p.age || 0;

        // The edge has gone stale, so the next poll should ask Apps Script.
        if (LAST_AGE >= EDGE_TRUST_MS) LAST_EDGE = false;

        var after = JSON.stringify(p.loads || []) +
                    JSON.stringify(p.onsite || []) +
                    JSON.stringify(p.drivers || []);
        if (after === before) return;
        if (TOUCHED) { offerRefresh(); return; }

        var y = window.scrollY;
        applyPayload(p);
        window.scrollTo(0, y);
      })
      .catch(function () { /* the view on screen is still usable */ });
  }

  // Something changed underneath a carrier who is mid-edit. Tell them, let
  // them choose when.
  function offerRefresh() {
    if (document.getElementById('stalebar')) return;
    var bar = document.createElement('div');
    bar.id = 'stalebar';
    bar.style.cssText =
      'position:sticky;top:0;z-index:20;background:#fffaf0;' +
      'border:1px solid #e8d9ac;color:#7a5c12;border-radius:4px;' +
      'padding:9px 12px;margin-bottom:10px;font-size:13px;text-align:center;';
    bar.innerHTML = 'Your board changed since this page opened. ' +
      '<a href="#" style="color:#7a5c12;font-weight:bold;">Reload it</a>';
    bar.querySelector('a').onclick = function (ev) {
      ev.preventDefault();
      TOUCHED = false;
      bar.parentNode.removeChild(bar);
      loadBoard(null, true);
    };
    var wrap = document.querySelector('.wrap');
    wrap.insertBefore(bar, wrap.firstChild);
  }

  // Submissions are serialized server-side. If another carrier holds the lock,
  // keep trying rather than handing the problem back to this one.
  function handleSendFailure(msg, payload, attempt, max, st) {
    var busy = msg.indexOf('BUSY') !== -1 ||
               msg.indexOf('could not record') !== -1 ||
               msg.toLowerCase().indexOf('timed out') !== -1 ||
               msg.toLowerCase().indexOf('failed to fetch') !== -1;

    if (busy && attempt < max - 1) {
      var wait = 2000 + attempt * 1500;
      st.innerHTML = '<span style="color:#8a6d1f;">Heavy traffic right now. ' +
                     'Retrying in ' + Math.round(wait / 1000) + 's...</span>';
      setTimeout(function () { sendWithRetry(payload, attempt + 1); }, wait);
      return;
    }

    st.innerHTML = '<span class="err">' +
      (busy
        ? 'Still busy after several tries. Your work may already have gone ' +
          'through, so reload before submitting again. If it has not, please ' +
          'try shortly or email nfc@nationalfreightconnection.com.'
        : esc(msg)) + '</span>';
    document.getElementById('send').disabled = false;
  }

  // The shell is already on screen; this only unhides it after an error state
  // hid it.
  function reveal() {
    document.getElementById('app').style.display = 'block';
  }

  // One place for every dead end, so a carrier never sees a raw error.
  function showDead(kind, detail) {
    var m = {
      missing:     ['This link is incomplete',
                    'The code on the end of it is missing, usually because an ' +
                    'email program split the address across two lines. Open ' +
                    'the original email and click the button rather than ' +
                    'copying the address.'],
      expired:     ['This link has expired',
                    'Links last 30 days. Reply to any of our emails and we ' +
                    'will send a fresh one straight away.'],
      unreachable: ['We could not reach your board',
                    'This is usually a connection problem rather than anything ' +
                    'wrong on your end. Try again in a moment.']
    }[kind] || ['Something went wrong', detail || 'Please try again shortly.'];

    if (typeof finishBar === 'function') finishBar();
    document.getElementById('app').style.display = 'none';
    var d = document.getElementById('dead');
    d.style.display = 'block';
    d.innerHTML =
      '<h2>' + esc(m[0]) + '</h2><p>' + esc(m[1]) + '</p>' +
      '<p class="mail"><a href="mailto:nfc@nationalfreightconnection.com">' +
      'nfc@nationalfreightconnection.com</a></p>';
  }
</script>
</body>
</html>
