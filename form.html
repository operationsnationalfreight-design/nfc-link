<script>
  // Fired here, in the head, before the stylesheet or the body have been
  // parsed. The request is the slow part by an order of magnitude, so it
  // should be in flight while the browser is still building the page rather
  // than waiting for a script tag at the bottom.
  window.API  = "https://script.google.com/macros/s/AKfycbye9ik0EjwQMQcAdf6xeKDRoQXHudRp-DP0tD6cg5dmimt4cyTfL0JxrSow-MrkgH2DXA/exec";
  window.EDGE = "https://edge.nationalfreightconnection.com";
  window.T0 = Date.now();

  var _t = new URLSearchParams(location.search).get('t') || '';

  // EDGE FIRST, APPS SCRIPT AS THE FALLBACK.
  //
  // The edge holds a copy of this carrier's board, pushed whenever we change
  // it, and answers in tens of milliseconds. Apps Script has to start a
  // container and read Sheets: 1.5 seconds warm, four cold, every visit.
  //
  // The fallback is not decoration. It runs whenever the edge has nothing for
  // this carrier yet, has let the entry expire, or cannot be reached at all,
  // and it is the reason a broken cache degrades into slowness rather than
  // into a carrier who cannot see their loads.
  function _appsScript(t) {
    return fetch(window.API + '?api=payload&t=' + encodeURIComponent(t),
                 { method: 'GET', redirect: 'follow' })
             .then(function (r) { return r.json(); });
  }

  window.BOARD = !_t
    ? Promise.resolve({ ok: false, error: 'missing' })
    : fetch(window.EDGE + '/payload?t=' + encodeURIComponent(_t),
            { method: 'GET' })
        .then(function (r) { return r.json(); })
        .then(function (p) {
          if (p && p.ok) return p;
          // "expired" is a real answer and means the token is dead: going to
          // Apps Script would only get the same verdict more slowly.
          if (p && p.error === 'expired') return p;
          return _appsScript(_t);
        })
        .catch(function () { return _appsScript(_t); });
</script>
<title>Driver &amp; Equipment Details | National Freight Connection</title>
<link rel="icon" type="image/svg+xml" href="https://nationalfreightconnection.com/images/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="https://nationalfreightconnection.com/images/favicon-32.png">
<link rel="apple-touch-icon" href="https://nationalfreightconnection.com/images/favicon-180.png">
<style>

  * { box-sizing: border-box; }
  body { font-family: -apple-system, Segoe UI, Arial, sans-serif; font-size: 14px;
         margin: 0; background: #eef1ef; color: #1c1c1c; }
  .wrap { max-width: 1220px; margin: 0 auto; padding: 14px; }
  .head { background: #0d3320; color: #fff; padding: 16px; border-radius: 5px;
          text-align: center; }
  .head h1 { margin: 0 0 3px; font-size: 20px; letter-spacing: .6px;
             text-transform: uppercase; }
  .head .sub { font-size: 13px; opacity: .85; text-transform: uppercase;
               letter-spacing: 1.2px; }
  .cols { display: flex; gap: 14px; align-items: flex-start; margin-top: 14px; }
  .col { flex: 1 1 0; min-width: 0; }
  .card { background: #fff; border: 1px solid #d8dcda; border-radius: 5px;
          padding: 12px; margin-bottom: 14px; }
  .card h2 { margin: 0 0 4px; font-size: 13px; text-transform: uppercase;
             letter-spacing: .6px; color: #0d3320; }
  .card .note { margin: 0 0 10px; font-size: 12px; color: #666; }

  .skel { height: 14px; border-radius: 3px; margin: 9px 0;
          background: linear-gradient(90deg,#e9edeb 25%,#f4f7f5 50%,#e9edeb 75%);
          background-size: 200% 100%; animation: sh 1.2s infinite; }
  .skel.w70 { width: 70%; } .skel.w45 { width: 45%; } .skel.w90 { width: 90%; }
  @keyframes sh { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  .dbar { background: #0d3320; color: #fff; font-size: 12px; font-weight: 700;
          letter-spacing: .8px; text-transform: uppercase; text-align: center;
          padding: 6px 8px; border-radius: 3px; margin: 16px 0 8px; }
  .dbar.first { margin-top: 0; }

  .load { border: 1px solid #d8dcda; border-left: 5px solid #bbb;
          border-radius: 4px; padding: 10px; margin-bottom: 10px; }
  .load.ok   { border-left-color: #2e7d32; background: #f4fbf5; }
  .load.need { border-left-color: #c62828; background: #fdf5f5; }
  .load.lock { border-left-color: #999; background: #f3f3f3; color: #777; }

  /* Bringing their own trailer for one load. Pool carriers normally take
     whatever we have in the yard, so this is them telling us not to reserve
     one. */
  .livebox { display: flex; align-items: center; gap: 6px; font-size: 13px;
             color: #444; margin: 8px 0 2px; cursor: pointer; }
  .livebox input { width: auto; margin: 0; }
  /* Centred and red, because it undoes work.
     Muted rather than alarming: this is a correction a carrier is entitled to
     make, not a warning, and a card is not the place for a stop sign. */
  /* The rename affordance sits on the label, not next to the value, so it
     never looks like part of the driver list itself. */
  .locked { background: #f5f6f5; color: #555; cursor: default; }
  .editnote { font-size: 11.5px; color: #8a6d1f; margin: 4px 0 2px; }
  .rename { float: right; font-weight: normal; font-size: 11.5px;
            color: #0d3320; cursor: pointer; text-decoration: underline; }
  .rename:hover { color: #1565c0; }
  .renamebox { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .renamebox input { flex: 1 1 140px; min-width: 0; }
  .renamebox button { font: inherit; font-size: 12.5px; padding: 6px 12px;
                      border-radius: 3px; cursor: pointer; }
  .rnok { border: 1px solid #0d3320; background: #0d3320; color: #fff; }
  .rncx { border: 1px solid #bfc5c2; background: #fff; color: #444; }
  .clearwrap { margin-top: 10px; text-align: center; }
  .clearbtn { font: inherit; font-size: 12.5px; padding: 7px 16px;
              border: 1px solid #e3b4b4; border-radius: 3px;
              background: #fdeceb; color: #9a2b2b; cursor: pointer; }
  .clearbtn:hover { background: #f8dcda; border-color: #d08f8f; }
  .livefields { display: none; }
  .livefields.on { display: block; }

  /* THE TRAILER ON A LOAD CARD.
     Pool carrier: a "Live load" tick (.livebox, above) opens trailer + ETA;
     otherwise we supply the trailer and nothing shows. Live-load carrier:
     trailer + ETA always, with an "Already on site" tick that swaps the ETA
     for current SCAC and empty drop. */
  /* A caption like the other panels': the live count in dark green, then one
     line of guidance. No box, no motion. */
  .loadsnote { margin: 0 0 10px; font-size: 12px; line-height: 1.45; color: #666; }
  .loadsnote b { display: block; font-size: 12.5px; color: #0d3320; }
  .loadsnote a { color: #0d3320; font-weight: 700; }
  .tf { display: none; }
  .tchoice[data-mode="live"] .tf-tl, .tchoice[data-mode="live"] .tf-eta,
  .tchoice[data-mode="coming"] .tf-tl, .tchoice[data-mode="coming"] .tf-eta,
  .tchoice[data-mode="onsite"] .tf-tl, .tchoice[data-mode="onsite"] .tf-os {
    display: block; }
  .tchoice .opt { text-transform: none; font-weight: normal; color: #999;
                  letter-spacing: 0; }
  .bobbox { display: flex; align-items: center; gap: 6px; margin: 7px 0 0;
            cursor: pointer; text-transform: none; letter-spacing: 0;
            font-size: 13px; font-weight: normal; color: #444; }
  .bobbox input { width: auto; margin: 0; }
  input:disabled { background: #f0f2f1; color: #999; }

  /* HYBRID DATE: a typed MM/DD box with a calendar button beside it. The
     button opens the browser's own date picker, which writes MM/DD back into
     the box, so typing and picking land in the same field. */
  .dh { display: flex; align-items: stretch; min-width: 0; position: relative; }
  .dh input.mdx { flex: 1 1 auto; min-width: 0; border-top-right-radius: 0;
                  border-bottom-right-radius: 0; }
  .dh .cal { flex: 0 0 30px; display: flex; align-items: center;
             justify-content: center; padding: 0; cursor: pointer;
             border: 1px solid #bfc5c2; border-left: 0; background: #f6f8f7;
             border-radius: 0 3px 3px 0; color: #0d3320; }
  .dh .cal:hover { background: #e8eeea; }
  .dh .calpick { position: absolute; left: 0; bottom: 0; width: 1px;
                 height: 1px !important; min-height: 0 !important; opacity: 0;
                 border: 0; padding: 0; pointer-events: none; }
  .er .dh .cal { border-color: transparent; background: transparent; }
  .er .dh .cal:hover { background: #eef2ef; }

  /* Incoming row: "Already on site" replaces the ETA with the words. */
  .osl { display: flex; align-items: center; gap: 5px; margin: 0; cursor: pointer;
         text-transform: none; letter-spacing: 0; font-size: 11.5px;
         font-weight: normal; color: #555; white-space: normal; line-height: 1.2; }
  .osl input { width: auto; margin: 0; min-height: 0 !important; flex: 0 0 auto; }
  .ostxt { display: none; grid-column: span 2; padding-left: 4px;
           font-size: 13px; font-weight: 700; color: #2e7d32; }
  .inc.os .dh, .inc.os .et2 { display: none; }
  .inc.os .ostxt { display: block; }

  /* A shipment from a rate confirmation that has not reached our board yet
     renders exactly like any other. Where it sits in OUR system is our
     problem: the carrier does the same thing either way, and the only
     difference they would ever notice is the load gaining a few more details
     once the import runs. */

  /* The shipment a loaded notification was about.
     
     The pulse is on the DRIVER FIELD, not the card. A glow around the whole
     card says "this one", which they already knew from the email. A glow on
     the driver box says "this is the thing to fill in", which is the entire
     reason they opened the link.
     
     Three pulses then it stops. This is a "here it is", not an alarm, and
     something blinking for the whole time they are typing wears thin fast. */
  /* Applied from JS once the scroll lands, not by the render.
     As a render-time class it began the instant the card was built, ran while
     the page was still scrolling toward it, and a background revalidate a
     second later rebuilt the card and killed it. By the time anyone looked at
     the field it had been and gone. */
  tr.jump { cursor: pointer; }
  tr.jump:hover td { background: #eef4f0; }
  tr.jump td:first-child b { border-bottom: 1px dotted #9aa7a0; }

  .pulse {
    animation: spot 1.5s ease-in-out 3;
    border-color: #2e7d32 !important;
  }
  @keyframes spot {
    0%, 100% { box-shadow: 0 0 0 0 rgba(46,125,50,0); background-color: #fff; }
    50%      { box-shadow: 0 0 0 7px rgba(46,125,50,.3); background-color: #eef8f0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .pulse { animation: none; box-shadow: 0 0 0 4px rgba(46,125,50,.25); }
  }
  .load.pend { border-left-color: #b8860b; background: #fffaf0; }

  .resched { color: #b8860b; font-weight: 700; }
  .pendmsg div { font-weight: 600; }
  .pendmsg { text-align: center; font-size: 11.5px; color: #8a6d1f;
             font-weight: 700; padding-bottom: 6px; }

  .lnum { text-align: center; font-weight: 800; font-size: 18px;
          letter-spacing: .4px; padding: 2px 0 2px; }
  .lnum .sep { color: #9aa39d; font-weight: 400; margin: 0 6px; }
  .lnum2 { text-align: center; font-size: 11.5px; font-weight: 400;
           color: #555; padding-bottom: 8px; letter-spacing: .3px; }

  .split { display: flex; gap: 12px; margin-top: 4px; }
  /* The fields need the room, the stops do not.
     An even split left the stop list sitting in whitespace while every input
     on the right was squeezed. */
  .split .left  { flex: 1 1 42%; min-width: 0; display: flex;
                  flex-direction: column; justify-content: center; }
  .split .right { flex: 1 1 58%; min-width: 0;
                  border-left: 1px solid #e0e4e2; padding-left: 12px; }
  .stops { font-size: 12.5px; color: #333; }
  .stops b { color: #0d3320; letter-spacing: .4px; }
  .stops .leg { padding: 1px 0 6px 8px; color: #333; }
  .stops .leg { color: #555; }
  .stops .leg .when { color: #222; font-weight: 600; padding-bottom: 1px; }

  select, input { width: 100%; font-family: inherit; font-size: 14px; padding: 7px;
                  border: 1px solid #bfc5c2; border-radius: 3px; background: #fff; }
  label { display: block; font-size: 10.5px; font-weight: 700; color: #666;
          margin: 6px 0 2px; text-transform: uppercase; letter-spacing: .3px;
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row2 { display: flex; gap: 7px; }
  /* Any child, not just a div.
     The ETA pair puts the inputs straight into a row2, so the old
     div-only rule left them at their intrinsic width. A text input
     shrinks to nothing and survives that; a native date or time
     input carries the browser's own picker chrome as a minimum and
     pushes out of the card instead. */
  .row2 > * { flex: 1 1 0; min-width: 0; }

  /* Date and time, sized like the incoming-trailer row: the date
     needs the room, the time does not. Wraps rather than overflows
     when the column is too narrow for both, which it is on the
     right half of a split card. */
  .etarow { display: flex; gap: 6px; flex-wrap: wrap; }
  /* min-width:0 is what actually lets them sit together.
     A native date input's intrinsic width includes the picker icon, and
     without this a flex child refuses to shrink below that, so the pair
     wrapped onto two lines with empty space beside each. The basis values set
     the ratio; this sets whether they are allowed to honour it. */
  .etarow input { min-height: 38px; min-width: 0; }
  .etarow .dh { flex: 3 1 120px; }
  .etarow input.letat { flex: 2 1 84px; }
  .dfields { display: none; }
  .dfields.on { display: block; }
  .newbox { margin-top: 8px; padding: 9px; border: 1px dashed #a8b8ad;
            border-radius: 3px; background: #f6faf7; display: none; }

  table.on { width: 100%; border-collapse: collapse; font-size: 12.5px;
             table-layout: fixed; }
  table.on th { font-size: 10.5px; text-transform: uppercase; color: #555;
                border-bottom: 1px solid #d8dcda; padding: 5px 6px;
                text-align: center; }
  table.on td { padding: 8px 6px; border-bottom: 1px solid #eee;
                text-align: center; vertical-align: middle;
                word-break: break-word; }
  table.on th.a, table.on td.a { width: 58%; }
  table.on tr.loaded td { background: #f4fbf5; }
  .tick { color: #2e7d32; font-weight: 700; }

  .inc { display: flex; gap: 8px; margin-bottom: 7px; }
  /* En route rows: what the trailer is for on one line, the editable fields
     under it, laid out exactly like an incoming row so the two panels read
     as the same kind of entry. */
  /* One grid for the whole card: header, trailers on the way, and new rows.
     Every value sits under the heading that names it, so the 24-hr hint is
     directly over the time it describes. */
  .inchead, .er .ln, #incoming .inc {
    display: grid; gap: 8px; align-items: center;
    /* The date column also holds the calendar button, so it gets the room. */
    grid-template-columns: minmax(0,1fr) minmax(0,.95fr) minmax(0,.85fr) minmax(0,.6fr); }
  /* PHONES: four columns do not fit, so each row stacks. Trailer across the
     full width, then ETA date and time side by side, then the on-site tick.
     The column headings go; the boxes say what they are. */
  @media (max-width: 600px) {
    .inchead { display: none !important; }
    .er .ln, #incoming .inc {
      grid-template-columns: minmax(0,1.4fr) minmax(0,1fr);
      grid-template-areas: "load load" "tl tl" "date time" "os os";
      row-gap: 8px; padding: 8px 0; }
    .er .ln > .for, #incoming .inc > .osl { grid-area: load; }
    #incoming .inc > .osl { grid-area: os; }
    .er .ln > .tl, #incoming .inc > .tl { grid-area: tl; }
    .er .ln > .dh, #incoming .inc > .dh { grid-area: date; }
    .er .ln > .et2, #incoming .inc > .et2 { grid-area: time; }
    #incoming .inc > .ostxt { grid-area: date / date / time / time; padding: 8px 2px; }
    #incoming .inc { border-bottom: 1px solid #f0f0f0; }
    .osl { font-size: 13px; }
  }
  .inchead { font-size: 10.5px; text-transform: uppercase; color: #555;
             letter-spacing: .03em; padding: 2px 4px 4px;
             border-bottom: 1px solid #ddd; }
  .inchead .hint { text-transform: none; color: #999; letter-spacing: 0; }
  #incoming .inc { margin: 6px 0 0; }
  #incoming .inc input { min-height: 34px; }
  .inc .newlbl { font-size: 12px; color: #999; padding-left: 4px; }
  .er { border-bottom: 1px solid #f0f0f0; padding: 1px 0;
        border-left: 3px solid transparent; }
  .er .for { font-size: 12.5px; padding-left: 4px; white-space: nowrap;
             overflow: hidden; text-overflow: ellipsis; }
  .er .for.un { color: #999; }
  .er .for.erjump { cursor: pointer; }
  .er .for.erjump b { border-bottom: 1px dotted #9aa7a0; }
  /* Reads as text, with a faint underline saying it can be changed; hover
     does not exist on a phone, so the underline has to say it alone. The
     full box appears while editing. */
  .er input { border-color: transparent; border-bottom: 1px dashed #c9cfcc;
              border-radius: 0; background: transparent;
              padding: 5px 4px; min-height: 0; font-size: 13.5px; }
  .er input:hover { border-color: #d5dad7; border-radius: 3px; }
  .er input:focus { border: 1px solid #bfc5c2; border-radius: 3px; background: #fff; }
  /* Past due in the yard's time zone. Cleared as soon as they type. */
  .er.late input.imd, .er.late input.et2 { color: #c62828; font-weight: 700; }
  /* Changed and not yet sent: the carrier can see what Submit will send. */
  .er.dirty { border-left-color: #d4a017; background: #fffaf0; }
  .er .pend { font-size: 11.5px; color: #8a6d1f; font-weight: 700; padding: 0 4px 4px; }

  /* Date and time pickers render taller than a text input on some browsers,
     which left the row ragged. */
  .inc input { min-height: 38px; }
  .addbtn { background: #fff; color: #0d3320; border: 1px solid #0d3320;
            font-size: 13px; padding: 7px 12px; border-radius: 3px; cursor: pointer; }
  .bar { position: sticky; bottom: 0; background: #eef1ef; padding: 12px 0 22px; }
  button.go { font-size: 16px; padding: 13px 34px; border-radius: 4px;
              border: 1px solid #0d3320; background: #0d3320; color: #fff;
              cursor: pointer; width: 100%; }
  button.go:disabled { opacity: .45; cursor: default; }
  #status { margin-top: 9px; font-size: 14px; text-align: center; }
  .ok2 { color: #2e7d32; font-weight: 700; }

  #ovl { display: none; position: fixed; inset: 0; background: rgba(20,28,24,.55);
         z-index: 50; align-items: center; justify-content: center; padding: 20px; }
  #ovl.on { display: flex; }
  /* The itemised list. Left aligned inside a centred box, because a list of
     changes is read line by line and centred text makes that work. */
  #ovllist { display: none; text-align: left; margin: 10px auto 4px;
             padding-left: 20px; max-width: 340px; font-size: 13.5px;
             line-height: 1.6; color: #333; }
  #ovllist li { margin: 2px 0; }
  #ovlbox { background: #fff; border-radius: 6px; max-width: 420px; width: 100%;
            padding: 26px 24px; text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,.3); }
  #ovlbox .tick2 { font-size: 34px; color: #2e7d32; line-height: 1; }
  #ovlbox h3 { margin: 12px 0 6px; font-size: 18px; color: #0d3320; }
  #ovlbox p { margin: 0 0 20px; font-size: 14px; color: #555; }
  #ovlbox button { font-size: 15px; padding: 11px 30px; border-radius: 4px;
                   border: 1px solid #0d3320; background: #0d3320; color: #fff;
                   cursor: pointer; width: 100%; }
  .err { color: #b32020; font-weight: 700; }
  @media (max-width: 900px) {
    .wrap { padding: 10px; }
    .cols { flex-direction: column; }
    .col, .card, .load { width: 100%; }
    .split { flex-direction: column; }
    .split .right { border-left: none; padding-left: 0;
                    border-top: 1px solid #e0e4e2; padding-top: 8px; }
  }

  /* The shell is static, so it comes off the CDN in about a tenth of a second.
     Hiding it behind a splash wasted that: the carrier would stare at nothing
     while the data fetch ran, when they could be reading the layout and
     watching it fill. Skeletons show where things will land.

     The bar along the top is the only thing that says "still working". It
     creeps toward 90% on a curve that never quite arrives, then snaps to full
     and fades the moment the data lands, so it finishes exactly when the wait
     does rather than lying about progress it cannot measure. */
  #bar { position: fixed; inset: 0; z-index: 60; pointer-events: none;
         display: flex; align-items: center; justify-content: center;
         background: rgba(238,241,239,.55);
         backdrop-filter: blur(7px); -webkit-backdrop-filter: blur(7px);
         transition: opacity .5s ease .1s; }
  #bar.done { opacity: 0; }

  /* The rig IS the progress indicator. It starts at the left edge of the lane
     and reaches the right as the data lands, so there is nothing to reconcile
     between a bar and a truck: one thing, one meaning. The lane is two rules
     with a dashed centre line, which is enough to read as road without
     pretending to be an illustration. */
  #bar .stage { width: 100%; padding: 0 4vw; }
  #bar .lane { position: relative; padding: 10px 0;
               border-top: 2px solid rgba(13,51,32,.3);
               border-bottom: 2px solid rgba(13,51,32,.3); }
  #bar .lane:after { content: ''; position: absolute; left: 0; right: 0;
                     top: 50%; height: 2px; margin-top: -1px;
                     background: repeating-linear-gradient(to right,
                       rgba(13,51,32,.28) 0 16px, transparent 16px 30px); }
  /* Parked at the start line from the first frame. Animating in from off-screen
     meant the road appeared, then the truck arrived a beat later, which read as
     a glitch rather than a departure. */
  #bar .rig { position: relative; z-index: 1; color: #0d3320;
              transform: translateX(0);
              transition: transform .45s ease-out; }
  #bar .rig svg { display: block; width: 133px; height: 73px; }
  @media (prefers-reduced-motion: reduce) {
    #bar .rig { transition: none; }
  }
  #app { display: block; }
  #dead { display: none; max-width: 460px; margin: 14vh auto 0; background: #fff;
          border: 1px solid #d8dcda; border-radius: 6px; padding: 28px 24px;
          text-align: center; }
  #dead h2 { margin: 0 0 10px; font-size: 17px; color: #0d3320; }
  #dead p { margin: 0 0 12px; font-size: 14px; line-height: 1.6; color: #555; }
  #dead .mail { font-size: 13px; }
</style>

<body>

<div id="bar" aria-hidden="true">
  <div class="stage">

<div id="app">
<div class="wrap">

  <div class="cols">

                <div id="incoming"></div>

    <div class="col">

            <div class="skel w90"></div><div class="skel w90"></div></div></div></div>

            <div class="split"><div class="left"><div class="skel w90"></div>
            <div class="skel w70"></div></div><div class="right">
            <div class="skel w90"></div><div class="skel w90"></div></div></div></div>

  <div id="ovl">

      <div class="tick2">&#10004;</div>

</div>

<script>
  // The carrier form, served from our own domain.
  //
  // This is the same form Apps Script renders, with two differences that are
  // the whole point: there is no Google chrome around it, and the shell comes
  // off a CDN instead of a cold container. Apps Script keeps the data and the
  // writes; it just stops owning the page.
  //
  // Everything security-relevant is unchanged. The token still proves who the
  // carrier is, still scopes to one SCAC, still expires on its own. Nothing
  // here can read anything the old form could not.
  var API = window.API;
  var EDGE = window.EDGE;


  // The token is the whole session. It is signed, scopes to one carrier and
  // expires on its own, so there is nothing to log in to and nothing else to
  // hold. Read exactly as it arrived: one altered character makes it invalid.
  var TOKEN = new URLSearchParams(location.search).get('t') || '';
  var TOUCHED = false;   // set the moment the carrier edits anything

  // The shipment a loaded notification pointed at, if this link came from one.
  //
  // Compared loosely. An exact match meant a stray space or a different case
  // between the URL and MASTER silently did nothing, and "silently did
  // nothing" is indistinguishable from "the feature is broken".
  var SPOT = (new URLSearchParams(location.search).get('b') || '')
               .trim().toUpperCase();
  var SPOTTED = false;   // only jump once, not on every background refresh
  var LAST_EDGE = false; // which path answered, for the console line
  var QUEUED = [];       // submissions the edge reports as queued
  var LOCALQ = [];       // what WE sent, until the board shows it
  var LAST_AGE  = 0;

  // Loads the edge knew about but MASTER does not yet.
  //
  // They vanished a second after the page rendered: the revalidate goes
  // straight to Apps Script for the authoritative answer, Apps Script only
  // knows the real board, and the reply replaced what the edge had merged.
  //
  // So they are kept here and re-merged into anything that arrives without
  // them. The real row wins the moment it exists, because the merge only adds
  // a BOL the payload does not already carry.
  var PROV = [];

  function isSpot(bol) {
    return !!SPOT && String(bol || '').trim().toUpperCase() === SPOT;
  }
  var SCAC  = '';
  var LOADS   = [];
  var DRIVERS = [];
  var ONSITE  = [];
  var POOL    = false;
  var PENDTL  = [];
  var HELD    = [];   // pool equipment on the way, from the carrier tab
  var INIT    = {};   // what each card was rendered with

  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
      .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }
  // HTML text inputs strip CR/LF when you assign .value. CARRIER holds some
  // CDL numbers with a line break in them, so the raw string and what the box
  // actually contains differ. Comparing the two produced phantom "driver
  // updated" rows on submissions where nothing was touched.
  function inputNorm(x) {
    return String(x == null ? '' : x).replace(/[\r\n]+/g, '').trim();
  }

  function byName(n) {
    for (var i = 0; i < DRIVERS.length; i++) if (DRIVERS[i].name === n) return DRIVERS[i];
    return null;
  }

  // The yards this carrier actually picks from, named.
  //
  // "our yard" told them nothing. A carrier running Perryville and Morris has
  // two yards and no way to tell which panel is about which, and one running a
  // single site should simply see its name. Derived from their own loads
  // rather than configured, so it cannot drift from what they are looking at.
  function siteNames() {
    var seen = {}, out = [];
    LOADS.forEach(function (l) {
      (l.stops || []).forEach(function (x) {
        if (!/pickup/i.test(String(x.type || ''))) return;
        var raw = String(x.city || '').toUpperCase();
        var name = /PERRYVILLE|\bBAL\b/.test(raw)  ? 'GEA Perryville'
                 : /MORRIS|\bCHI\b|\bMOR\b/.test(raw) ? 'GEA Morris'
                 : /LOUISVILLE|\bLOU\b/.test(raw)  ? 'GEA Louisville'
                 : String(x.city || '').trim();
        if (name && !seen[name]) { seen[name] = 1; out.push(name); }
      });
    });
    return out;
  }

  function sitePhrase() {
    var n = siteNames();
    if (!n.length) return '';
    if (n.length === 1) return n[0];
    if (n.length === 2) return n[0] + ' and ' + n[1];
    return n.slice(0, -1).join(', ') + ' and ' + n[n.length - 1];
  }

  function renderSiteNotes() {
    var where = sitePhrase();
    var on = document.getElementById('onsitenote');
    var inc = document.getElementById('incnote');
    if (on) {
      on.textContent = where ? 'At ' + where + '.' : 'Currently tracked.';
    }
    if (inc) {
      // One sentence per line. The second only offers corrections when there
      // is something listed to correct.
      inc.innerHTML = (where ? 'Heading to ' + esc(where) + '.' : 'Heading in.') +
                      (enrouteRows().length ? '<br>Correct a number or ETA, or add new below.' : '');
    }
  }

  function renderOnsite() {
    var h = document.getElementById('onsite');
    if (!ONSITE.length) {
      // The caption above already names the yard, so this does not. Two
      // sentences one line apart both ending in GEA Perryville read as a
      // template rather than as something written for them.
      h.innerHTML = '<p class="note">Nothing tracked right now.<br>' +
                    'Add incoming equipment below.</p>';
      return;
    }
    var t = '<table class="on"><tr><th>Trailer</th><th class="a">Assigned To</th><th>Status</th></tr>';
    ONSITE.forEach(function(o) {
      var cell, state;

      if (o.isReturn) {
        // A return is not an assignment and not ready equipment. Saying
        // "loaded" next to a shipment number reads as good to go, when the
        // trailer actually needs unloading before anyone can use it.
        cell = '<div style="font-weight:700;">Return Delivered</div>' +
               (o.assignedText
                 ? '<div style="font-size:11.5px;color:#555;padding-top:2px;">' +
                   esc(o.assignedText) + '</div>'
                 : '');
        state = '<span style="color:#1565c0;font-weight:700;">needs unloading</span>';
      } else {
        if (o.assignedText) {
          var parts = o.assignedText.split('\n');
          cell = '<div style="font-weight:700;">' + esc(parts[0]) + '</div>';
          if (parts[1]) {
            cell += '<div style="font-size:11.5px;color:#555;padding-top:2px;">' +
                    esc(parts[1]) + '</div>';
          }
        } else {
          cell = '<span style="color:#999">unassigned</span>';
        }
        state = o.loaded ? '<span class="tick">&#10004; loaded</span>'
                         : '<span style="color:#999">empty</span>';
      }

      // A trailer with a load behind it is a link to that load. Reviewing the
      // yard and assigning drivers are the same job from two directions, and
      // scrolling a long board to find the shipment a trailer belongs to was
      // the tedious half of it.
      var jumpable = !!o.bol && !o.isReturn;
      t += '<tr class="' + (o.loaded && !o.isReturn ? 'loaded' : '') +
           (jumpable ? ' jump' : '') + '"' +
           (jumpable ? ' data-bol="' + esc(o.bol) + '" title="Go to this shipment"' : '') +
           '>' +
           '<td><b>' + esc(o.tl) + '</b></td>' +
           '<td class="a">' + cell + '</td>' +
           '<td>' + state + '</td></tr>';
    });
    h.innerHTML = t + '</table>';
  }

  // TRAILERS ALREADY ON THE WAY, at the top of the Incoming Trailers card.
  // Pool carriers only.
  //
  // Two kinds of row, one panel, because to the carrier they are the same
  // thing: a trailer on its way whose number or ETA may have changed.
  //   Assigned: a trailer we gave to one of their loads that has not arrived.
  //     The load card hides trailer fields for a pool carrier unless they tick
  //     the live box, and ticking it declares something else entirely, so
  //     without this row a changed ETA had no honest place to go. Submits
  //     against the BOL, landing on MASTER R and K like any card edit.
  //   Unassigned: an entry in their tab's column K with an ETA. Submits
  //     without a BOL, carrying the old number so promote rewrites that entry
  //     instead of adding a second one.
  // Live-load carriers edit on the load card itself, so they never see this.
  function enrouteAtYard(tl, eta) {
    var here = String(tl || '').trim().toUpperCase();
    return /^(AT ADC|SCAC SWAP|ON SITE)$/i.test(String(eta || '').trim()) ||
           (!!here && (ONSITE || []).some(function (o) {
             return String(o.tl || '').trim().toUpperCase() === here;
           }));
  }

  function enrouteRows() {
    if (!POOL) return [];
    var rows = [];
    (LOADS || []).forEach(function (l) {
      if (!l.tl || l.gone || l.loaded || l.pendingTrailerClear) return;
      if (enrouteAtYard(l.tl, l.eta)) return;
      var d = String(l.delv || '');
      d = d.length >= 10 ? d.slice(5).replace('-', '/') : d;
      rows.push({ tl: l.tl, eta: l.eta || '', bol: l.bol, nfc: l.nfc, delv: d,
                  due: l.etaDue || 0 });
    });
    (HELD || []).forEach(function (h) {
      rows.push({ tl: h.tl, eta: h.eta || '', bol: '', nfc: '', delv: '',
                  due: h.due || 0 });
    });
    return rows;
  }

  function renderEnroute() {
    var rows = enrouteRows();
    // The header always shows: the blank row sits in the same columns and
    // needs the same headings, the 24-hr hint most of all.
    var h = document.getElementById('enroute');
    if (!rows.length) { h.innerHTML = ''; return; }

    h.innerHTML = rows.map(function (r) {
      var sp = etaSplit(r.eta);
      var md = isoToMD(sp.date);
      // The comparison value, built the same way a submission is, so an
      // untouched row is recognisably untouched whatever the sheet's text.
      var orig = etaJoin(md, sp.time);

      var pend = (PENDTL || []).filter(function (t) {
        return t.was && (r.bol ? t.bol === r.bol
                               : String(t.was).toUpperCase() === String(r.tl).toUpperCase());
      }).pop();

      // NFC number and delivery date identify the load; the BOL is on the
      // card, one click away.
      var load = r.bol
        ? '<div class="for erjump" data-bol="' + esc(r.bol) + '" title="Go to ' +
          esc(r.bol) + '"><b>' + esc(r.nfc) + '</b>' +
          (r.delv ? ' &middot; ' + esc(r.delv) : '') + '</div>'
        : '<div class="for un">Unassigned</div>';

      return '<div class="er' + (etaPastDue(r.due) ? ' late' : '') +
             '" data-bol="' + esc(r.bol) + '" data-nfc="' + esc(r.nfc) +
             '" data-otl="' + esc(r.tl) + '" data-oeta="' + esc(orig) + '">' +
             '<div class="ln">' + load +
             '<input class="tl" value="' + esc(r.tl) + '" title="Trailer #, all letters and numbers" placeholder="All letters &amp; numbers" onblur="tlCheck(this)" oninput="this.setCustomValidity(\'\')">' +
             dateBox('imd', '', md) +
             '<input class="et2" type="text" inputmode="numeric" maxlength="5" ' +
             'placeholder="HH:MM" title="ETA time, 24 hour" oninput="onHHMM(this)" value="' +
             esc(sp.time) + '">' +
             '</div>' +
             (pend ? '<div class="pend">Received, pending confirmation: ' + esc(pend.tl) +
                     (pend.eta ? ' &middot; ' + esc(etaShow(pend.eta)) : '') + '</div>' : '') +
             '</div>';
    }).join('');
  }

  // Red means "this needs an answer". Once they are typing one, it has one.
  // And a changed row is marked, so what Submit will send is visible before
  // it is sent. Compared the same way the submission is, so putting a value
  // back unmarks the row.
  document.addEventListener('input', function (ev) {
    var er = ev.target && ev.target.closest ? ev.target.closest('.er') : null;
    if (!er) return;
    er.classList.remove('late');
    var tl  = er.querySelector('.tl').value.trim();
    var eta = etaJoin(mmdd(er.querySelector('.imd').value),
                      hhmm(er.querySelector('.et2').value));
    er.classList.toggle('dirty',
      tl !== (er.getAttribute('data-otl') || '') ||
      eta !== (er.getAttribute('data-oeta') || ''));
  });

  // The label on an assigned row goes to its load, like a row in the onsite
  // panel. Delegated for the same reason: the panel is rebuilt on refresh.
  document.addEventListener('click', function (ev) {
    var el = ev.target && ev.target.closest ? ev.target.closest('.erjump') : null;
    if (el) goToLoad(el.getAttribute('data-bol'));
  });

  // Trailers this carrier already reported that we have not processed yet.
  function renderPendingTrailers() {
    // Edits made in the en-route panel show against their own row there, not
    // here as if they were new equipment.
    var list = PENDTL.filter(function (t) { return !t.was; });
    if (!list.length) return;
    var lines = list.map(function(t) {
      return esc(t.tl) + (t.eta ? ' &middot; ' + esc(etaShow(t.eta)) : '');
    }).join('<br>');
    // Above the blank rows: these are already sent, not rows to fill in.
    document.getElementById('incoming').insertAdjacentHTML('beforebegin',
      '<p class="note" id="pendtl" style="color:#8a6d1f;font-weight:700;">' +
      'Received, pending confirmation:<br>' + lines + '</p>');
  }

  // ETA as two native pickers rather than one free-text box.
  //
  // A single field invited prose: "will advise", "tomorrow am", "waiting on
  // driver". Those are reasonable things for a carrier to say and useless in
  // MASTER column K, which everything downstream reads as a time. Splitting it
  // into a date and a time means the browser supplies the keyboard and the
  // format, and there is nothing to mistype.
  //
  // Stored and submitted in the format the sheet already uses: "0600 09/15".
  // Today, in the format a date input wants.
  //
  // Defaulted because almost every trailer a carrier reports is arriving
  // today or tonight, and making them pick the date they are already living
  // in is a step that earns nothing. They can still change it.
  //
  // Computed from the LOCAL date rather than an ISO string, which would be
  // UTC and shows tomorrow's date to anyone reporting after 7pm Central.
  function todayValue() {
    var d = new Date();
    return d.getFullYear() + '-' +
           ('0' + (d.getMonth() + 1)).slice(-2) + '-' +
           ('0' + d.getDate()).slice(-2);
  }

  function etaJoin(dateVal, timeVal) {
    var d = String(dateVal || '').trim();
    var t = String(timeVal || '').trim();
    if (!d && !t) return '';

    var hhmm = t ? t.replace(':', '') : '';
    if (!d) return hhmm;

    // MM/DD as typed, or yyyy-mm-dd from a date input on a load card.
    var md;
    if (/^\d{2}\/\d{2}$/.test(d)) md = d;
    else {
      var bits = d.split('-');
      if (bits.length !== 3) return hhmm;
      md = bits[1] + '/' + bits[2];
    }
    return hhmm ? hhmm + ' ' + md : md;
  }

  // Back the other way, to prefill from whatever is already on the sheet.
  // Anything that does not parse leaves the pickers empty rather than
  // guessing, so a note someone typed previously is not silently reshaped.
  function etaSplit(v) {
    var s = String(v || '').trim();
    var out = { date: '', time: '' };
    if (!s) return out;

    var mt = s.match(/(^|\s)([01]?\d|2[0-3]):?([0-5]\d)(\s|$)/);
    if (mt) out.time = ('0' + mt[2]).slice(-2) + ':' + mt[3];

    var md = s.match(/(^|\s)(\d{1,2})\/(\d{1,2})(\s|$)/);
    if (md) {
      var yr = new Date().getFullYear();
      out.date = yr + '-' + ('0' + md[2]).slice(-2) + '-' + ('0' + md[3]).slice(-2);
    }
    return out;
  }

  // BLANK, NOT TODAY. A prefilled date let a trailer go in with a date the
  // carrier never chose, and the ETA is now required whenever a trailer is
  // named, so the default would have satisfied the rule on its own.
  //
  // "Already on site" replaces the ETA with one more tick: "Not currently under
  // NFCJ". Ticked, it is a SCAC swap (we ask ADC to move it to NFCJ). Left
  // unticked, the carrier is only correcting a number or naming the trailer
  // actually dropped: recorded as on site, nobody emailed.
  function incRow() {
    return '<div class="inc">' +
           '<label class="osl"><input type="checkbox" class="ios" ' +
           'onchange="onIncOnsite(this)">Already on site</label>' +
           '<input class="tl" title="Trailer #, all letters and numbers" placeholder="All letters &amp; numbers" onblur="tlCheck(this)" oninput="this.setCustomValidity(\'\')">' +
           dateBox('imd', '', '') +
           '<input class="et2 hhmm" type="text" inputmode="numeric" ' +
           'maxlength="5" placeholder="HH:MM" title="ETA time, 24 hour" ' +
           'oninput="onHHMM(this)"><span class="ostxt"><label class="osl">' +
           '<input type="checkbox" class="ioswap">Not currently under NFCJ</label></span></div>';
  }
  // TRAILER NUMBERS: every letter and number. Carriers were typing "618" for
  // "25V618". If what they typed is numbers only while their own trailers on
  // file carry letters, the browser points at the box with one of their own
  // trailers as the example. It never blocks a submit, clears as they type,
  // and a carrier whose trailers really are all numbers never sees it.
  function tlExample() {
    var all = [];
    (ONSITE || []).forEach(function (o) { all.push(o.tl); });
    (LOADS || []).forEach(function (l) { all.push(l.tl); });
    for (var i = 0; i < all.length; i++) {
      var t = String(all[i] || '').trim();
      if (/[A-Za-z]/.test(t) && /\d/.test(t)) return t.toUpperCase();
    }
    return '';
  }
  function tlCheck(el) {
    var v = String(el.value || '').trim();
    el.setCustomValidity('');
    if (!/^\d+$/.test(v)) return;
    var ex = tlExample();
    if (!ex) return;
    el.setCustomValidity('Enter the full trailer number, every letter and number (like ' + ex + ').');
    el.reportValidity();
  }

  function onIncOnsite(box) {
    var row = box.closest('.inc');
    row.classList.toggle('os', box.checked);
    if (box.checked) {
      row.querySelector('.imd').value = '';
      row.querySelector('.et2').value = '';
    }
  }

  // ---- Hybrid date: typed MM/DD plus the native picker behind an icon.
  var CAL_SVG = '<svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true">' +
    '<rect x="1.5" y="3" width="13" height="11.5" rx="1.5" fill="none" ' +
    'stroke="currentColor" stroke-width="1.4"/><path d="M1.5 6.5h13M5 1.5v3M11 1.5v3" ' +
    'stroke="currentColor" stroke-width="1.4" fill="none"/></svg>';
  function dateBox(cls, attrs, md) {
    return '<span class="dh"><input class="' + cls + ' mdx" type="text" ' +
           'inputmode="numeric" maxlength="5" placeholder="MM/DD" title="ETA date" ' +
           'oninput="onMMDD(this)"' + (attrs || '') + ' value="' + esc(md || '') + '">' +
           '<button type="button" class="cal" tabindex="-1" title="Pick a date" ' +
           'onclick="openCal(this)">' + CAL_SVG + '</button>' +
           '<input type="date" class="calpick" tabindex="-1" aria-hidden="true" ' +
           'onchange="calPicked(this)"></span>';
  }
  // Referenced by every MM/DD box and never defined until now, so typing
  // threw quietly and the slash never appeared. Digits in, MM/DD out.
  // A first digit of 2 to 9 can only be a month on its own, so "924" is
  // 09/24 as it is typed, not 92/4.
  function onMMDD(el) {
    var d = String(el.value || '').replace(/[^\d]/g, '');
    if (d && d.charAt(0) > '1') d = '0' + d;
    d = d.slice(0, 4);
    el.value = d.length >= 3 ? d.slice(0, 2) + '/' + d.slice(2) : d;
  }
  // MM/DD -> yyyy-mm-dd for the picker, in whichever year puts it nearest
  // today, so 01/03 picked on 30 December opens next January.
  function mdToIso(md) {
    var m = String(md || '').match(/^(\d{2})\/(\d{2})$/);
    if (!m) return '';
    var now = new Date(), best = null;
    [0, 1, -1].forEach(function (k) {
      var d = new Date(now.getFullYear() + k, +m[1] - 1, +m[2]);
      if (!best || Math.abs(d - now) < Math.abs(best - now)) best = d;
    });
    return best.getFullYear() + '-' + m[1] + '-' + m[2];
  }
  function openCal(btn) {
    var box = btn.parentNode;
    var txt = box.querySelector('.mdx'), pick = box.querySelector('.calpick');
    pick.value = mdToIso(mmdd(txt.value)) || todayValue();
    try { if (pick.showPicker) { pick.showPicker(); return; } } catch (e) {}
    pick.style.pointerEvents = 'auto'; pick.focus(); pick.click();
    pick.style.pointerEvents = '';
  }
  function calPicked(pick) {
    var txt = pick.parentNode.querySelector('.mdx');
    txt.value = isoToMD(pick.value);
    txt.dispatchEvent(new Event('input', { bubbles: true }));
  }

  // provisional load would either linger after the payload had written it off
  // or vanish while the payload still considered it live.
  var DELV_GRACE_HOURS = 3;

  // own time zone, with every load it builds. Only a provisional copy pushed
  // before that existed lacks it, and for those the page works the instant
  // out itself from the state on the stop, in that zone, never by the
  // browser's own clock: "10:45, FARMINGDALE, NY" is 10:45 Eastern wherever
  // the carrier is sitting.
  var STATE_TZ = (function () {
    var z = {};
    'CT DC DE FL GA IN KY MA MD ME MI NC NH NJ NY OH PA RI SC VA VT WV'.split(' ')
      .forEach(function (s) { z[s] = 'America/New_York'; });
    'AZ CO ID MT NM UT WY'.split(' ').forEach(function (s) { z[s] = 'America/Denver'; });
    'CA NV OR WA'.split(' ').forEach(function (s) { z[s] = 'America/Los_Angeles'; });

  // Wall-clock time in a zone -> absolute milliseconds.
  function zonedMs(y, mo, d, h, mi, tz) {
    var guess = Date.UTC(y, mo - 1, d, h, mi);
    try {
      var parts = new Intl.DateTimeFormat('en-US', {
        timeZone: tz, hourCycle: 'h23', year: 'numeric', month: '2-digit',
        day: '2-digit', hour: '2-digit', minute: '2-digit' }).formatToParts(new Date(guess));
      var g = {};
      parts.forEach(function (p) { g[p.type] = +p.value; });
      var asUtc = Date.UTC(g.year, g.month - 1, g.day, g.hour % 24, g.minute);
      return guess - (asUtc - guess);

  function delvPassed(l) {
    var grace = DELV_GRACE_HOURS * 3600000;
    if (l && l.delvDue) return Date.now() > l.delvDue + grace;

    var stops = (l && l.stops) || [];
    var dels = stops.filter(function (s) { return /delivery/i.test(s.type || ''); });
    var last = dels.length ? dels[dels.length - 1] : null;

    if (last && last.date && last.time) {
      // MM/DD/YYYY or YYYY-MM-DD; "FARMINGDALE, NY" or "FARMINGDALE NY 11735".
      var m = String(last.date).match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
      var ymd = m ? [+m[3], +m[1], +m[2]] : null;
      if (!ymd) {
        m = String(last.date).match(/^(\d{4})-(\d{2})-(\d{2})$/);
        if (m) ymd = [+m[1], +m[2], +m[3]];
      }
      var t = String(last.time).match(/^(\d{1,2}):(\d{2})$/);
      if (ymd && t) {
        var st = String(last.city || '').toUpperCase()
                   .match(/(?:,\s*|\s)([A-Z]{2})(?:\s+\d{5}(?:-\d{4})?)?\s*$/);
        var tz = (st && STATE_TZ[st[1]]) || 'America/Chicago';
        return Date.now() > zonedMs(ymd[0], ymd[1], ymd[2], +t[1], +t[2], tz) + grace;

    if (!dv) return false;

  function mmdd(v) {

  // carrier who types four digits and never touches the colon is still

  function hhmm(v) {
    var d = String(v || '').replace(/[^\d]/g, '');

  // RET-1069652790-01 or B21439060, and both forms turn up. Matched on shape

  function isReturn(l) {

  // Scrolls to the flagged card once it is actually laid out.
